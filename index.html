<script>
// Local stand-in for google.script.run, backed by SEED.
//   - dev preview (serve.ps1): data lives in memory and resets on reload
//   - offline desktop build (build-offline.ps1 sets window.OFFLINE = true): data is saved in localStorage
// Keep the rules here in step with Code.gs (placeLesson, importAll, …).
(function () {
  var KEY = 'school-timetable-db-v1';
  var mockToken = '';
  function locked() { return !window.OFFLINE && /locked/.test(location.hash); }
  var now = function () { return new Date().toISOString(); };
  var copy = function (o) { return JSON.parse(JSON.stringify(o)); };
  var rid = function (p) { return p + '-' + Math.random().toString(16).slice(2, 10); };

  function seedDb() {
    return {
      school: SEED.schoolName,
      terms: SEED.terms.map(function (r) { return { id: r[0], label: r[1], order: r[2] }; }),
      teachers: SEED.teachers.map(function (r) {
        return { id: r[0], termId: r[1], order: r[2], prefix: r[3], firstName: r[4], lastName: r[5], homeroom: r[6], updatedAt: '2026-01-01T00:00:00.000Z' };
      }),
      subjects: SEED.subjects.map(function (r) {
        return { id: r[0], termId: r[1], order: r[2], code: r[3], name: r[4], unit: r[5], level: r[6], rooms: r[7], note: r[8],
          room1: r[9], room2: r[10], room3: r[11], combine: '', tags: '', updatedAt: '2026-01-01T00:00:00.000Z' };
      }),
      schedules: {},
      print: {},
      fixed: [],
      timetable: []
    };
  }

  function load() {
    if (!window.OFFLINE) return seedDb();
    try {
      var saved = JSON.parse(localStorage.getItem(KEY));
      if (saved && saved.terms) {
        ['schedules', 'print'].forEach(function (k) { saved[k] = saved[k] || {}; });
        ['fixed', 'timetable'].forEach(function (k) { saved[k] = saved[k] || []; });
        saved.subjects.forEach(function (s) { s.combine = s.combine || ''; s.tags = s.tags || ''; });
        return saved;
      }
    } catch (e) { /* ใช้ข้อมูลตั้งต้น */ }
    return seedDb();
  }
  var db = load();

  function save() {
    if (!window.OFFLINE) return;
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { throw new Error('บันทึกลงเครื่องไม่สำเร็จ (' + e.message + ')'); }
  }

  function findSubject(id) { return db.subjects.filter(function (x) { return x.id === id; })[0]; }
  function scheduleOf(termId) { return db.schedules[termId] || SEED.defaultSchedule; }

  var api = {
    getData: function () {
      var schedules = {};
      db.terms.forEach(function (t) { schedules[t.id] = scheduleOf(t.id); });
      return { school: db.school, terms: copy(db.terms), teachers: copy(db.teachers), subjects: copy(db.subjects),
        schedules: copy(schedules), print: copy(db.print), fixed: copy(db.fixed), timetable: copy(db.timetable),
        user: window.OFFLINE ? 'ใช้งานในเครื่องนี้' : locked() ? '' : 'preview@example.com',
        canEdit: !/readonly/.test(location.hash) && (!locked() || mockToken === 'preview-token'), sheetUrl: locked() && mockToken !== 'preview-token' ? '' : '#', offline: !!window.OFFLINE };
    },
    saveRooms: function (id, rooms, exp, combine) {
      var s = findSubject(id);
      if (exp && s.updatedAt !== exp) return { conflict: true, row: copy(s) };
      s.room1 = rooms[0] || ''; s.room2 = rooms[1] || ''; s.room3 = rooms[2] || '';
      if (combine !== undefined && combine !== null) {
        var c = String(combine).split(',').map(Number).filter(function (r, i, a) { return r >= 1 && r <= 3 && a.indexOf(r) === i; }).sort();
        s.combine = c.join(',');
        if (c.length >= 2) {
          var tid = c.map(function (r) { return s['room' + r]; }).filter(String)[0] || '';
          c.forEach(function (r) { s['room' + r] = tid; });
        }
      }
      s.updatedAt = now();
      return { conflict: false, row: copy(s) };
    },
    saveTags: function (id, tags) {
      var s = findSubject(id);
      s.tags = tags.filter(function (t) { return ['morning', 'double', 'pe', 'agri'].indexOf(t) >= 0; }).join(',');
      s.updatedAt = now();
      return { conflict: false, row: copy(s) };
    },
    saveSubject: function (o, exp) {
      var s = o.id ? findSubject(o.id) : null;
      if (s && exp && s.updatedAt !== exp) return { conflict: true, row: copy(s) };
      if (!s) { s = { id: rid('S'), room1: '', room2: '', room3: '', combine: '', tags: '' }; db.subjects.push(s); }
      ['termId', 'code', 'name', 'note'].forEach(function (k) { s[k] = String(o[k]); });
      ['order', 'unit', 'level', 'rooms'].forEach(function (k) { s[k] = Number(o[k]); });
      s.updatedAt = now();
      return { conflict: false, row: copy(s) };
    },
    deleteSubject: function (id) {
      db.subjects = db.subjects.filter(function (x) { return x.id !== id; });
      var before = db.timetable.length;
      db.timetable = db.timetable.filter(function (l) { return l.subjectId !== id; });
      return { ok: true, lessons: before - db.timetable.length };
    },
    saveTeacher: function (o, exp) {
      var t = o.id ? db.teachers.filter(function (x) { return x.id === o.id; })[0] : null;
      if (t && exp && t.updatedAt !== exp) return { conflict: true, row: copy(t) };
      if (!t) { t = { id: rid('T') }; db.teachers.push(t); }
      ['termId', 'prefix', 'firstName', 'lastName', 'homeroom'].forEach(function (k) { t[k] = String(o[k]); });
      t.order = Number(o.order); t.updatedAt = now();
      return { conflict: false, row: copy(t) };
    },
    deleteTeacher: function (id) {
      var cleared = [];
      db.subjects.forEach(function (s) { ['room1', 'room2', 'room3'].forEach(function (k) { if (s[k] === id) { s[k] = ''; cleared.push(s.id); } }); });
      db.teachers = db.teachers.filter(function (x) { return x.id !== id; });
      return { ok: true, cleared: cleared };
    },
    createTerm: function (o) {
      if (db.terms.some(function (t) { return t.id === o.id; })) throw new Error('มีภาคเรียน ' + o.id + ' อยู่แล้ว');
      db.terms.push({ id: o.id, label: o.label, order: db.terms.length + 1 });
      var map = {}, nt = 0, ns = 0;
      db.teachers.filter(function (t) { return t.termId === o.copyFrom; }).forEach(function (t) {
        var n = copy(t); n.id = rid('T'); n.termId = o.id; map[t.id] = n.id; db.teachers.push(n); nt++;
      });
      db.subjects.filter(function (s) { return s.termId === o.copyFrom; }).forEach(function (s) {
        var n = copy(s); n.id = rid('S'); n.termId = o.id;
        ['room1', 'room2', 'room3'].forEach(function (k) { n[k] = o.copyAssign ? (map[s[k]] || '') : ''; });
        db.subjects.push(n); ns++;
      });
      if (o.copyFrom) {
        if (db.schedules[o.copyFrom]) db.schedules[o.id] = copy(db.schedules[o.copyFrom]);
        db.fixed.filter(function (f) { return f.termId === o.copyFrom; }).forEach(function (f) {
          var n = copy(f); n.id = rid('F'); n.termId = o.id; db.fixed.push(n);
        });
      }
      return { ok: true, teachers: nt, subjects: ns };
    },
    renameTerm: function (id, label) { db.terms.filter(function (t) { return t.id === id; })[0].label = label; return { ok: true }; },
    saveSchoolName: function (n) { db.school = n; return { ok: true }; },
    exportReport: function (name, title, header, rows) { window.__lastExport = { name: name, title: title, header: header, rows: rows }; return { url: 'about:blank' }; },

    saveSchedule: function (termId, s) {
      if (!s.days.length) throw new Error('ต้องเลือกวันเรียนอย่างน้อย 1 วัน');
      db.schedules[termId] = copy(s);
      return { ok: true, schedule: copy(s) };
    },
    saveFixed: function (f) {
      var rows = [], skipped = 0;
      f.days.forEach(function (day) {
        var dup = db.fixed.some(function (x) { return x.termId === f.termId && x.day === day && x.period === f.period && x.level === f.level && x.room === f.room; });
        if (dup) { skipped++; return; }
        var row = { id: rid('F'), termId: f.termId, day: day, period: f.period, level: f.level, room: f.room, label: f.label, updatedAt: now() };
        db.fixed.push(row); rows.push(copy(row));
      });
      return { rows: rows, skipped: skipped };
    },
    deleteFixed: function (id) { db.fixed = db.fixed.filter(function (x) { return x.id !== id; }); return { ok: true }; },

    placeLesson: function (l) {
      var subj = findSubject(l.subjectId);
      if (!subj || subj.termId !== l.termId) throw new Error('ไม่พบรายวิชานี้ (อาจถูกลบไปแล้ว)');
      var sched = scheduleOf(l.termId);
      var nClass = sched.periods.filter(function (p) { return p.type === 'class'; }).length;
      if (sched.days.indexOf(l.day) < 0 || !(l.period >= 1 && l.period <= nClass)) throw new Error('ช่องนี้อยู่นอกวัน/คาบเรียนที่ตั้งไว้');
      var fx = db.fixed.filter(function (f) {
        return f.termId === l.termId && f.day === l.day && f.period === l.period && (!f.level || (f.level === subj.level && (!f.room || f.room === l.room)));
      })[0];
      if (fx) throw new Error('ช่องนี้ล็อกไว้สำหรับ ' + fx.label);
      var taken = db.timetable.filter(function (x) {
        var s = findSubject(x.subjectId);
        return x.id !== l.id && x.termId === l.termId && x.day === l.day && x.period === l.period && x.room === l.room && s && s.level === subj.level;
      })[0];
      if (taken) throw new Error('ม.' + subj.level + '/' + l.room + ' มีวิชา ' + findSubject(taken.subjectId).code + ' ในช่องนี้แล้ว');
      var row;
      if (l.id) {
        row = db.timetable.filter(function (x) { return x.id === l.id; })[0];
        if (!row) throw new Error('ไม่พบคาบนี้ (อาจถูกลบไปแล้ว)');
        row.day = l.day; row.period = l.period; row.updatedAt = now();
      } else {
        row = { id: rid('L'), termId: l.termId, subjectId: subj.id, room: l.room, day: l.day, period: l.period, place: '', updatedAt: now() };
        db.timetable.push(row);
      }
      return { row: copy(row) };
    },
    removeLesson: function (id) { db.timetable = db.timetable.filter(function (x) { return x.id !== id; }); return { ok: true }; },
    placeLessons: function (termId, list) {
      // ถ้าคาบไหนวางไม่ได้ runner จะคืนข้อมูลเดิมทั้งหมด (เหมือน Code.gs ที่ไม่บันทึกเลย)
      return { rows: list.map(function (l) {
        var row = api.placeLesson({ termId: termId, subjectId: l.subjectId, room: l.room, day: l.day, period: l.period });
        var saved = db.timetable.filter(function (x) { return x.id === row.row.id; })[0];
        saved.place = String(l.place || '');
        return copy(saved);
      }) };
    },
    removeLessons: function (ids) {
      var before = db.timetable.length;
      db.timetable = db.timetable.filter(function (x) { return ids.indexOf(x.id) < 0; });
      return { ok: true, removed: before - db.timetable.length };
    },
    setPlace: function (termId, subjectId, room, place) {
      var ids = [];
      place = String(place || '').trim();
      db.timetable.forEach(function (l) {
        if (l.termId === termId && l.subjectId === subjectId && l.room === room) { l.place = place; ids.push(l.id); }
      });
      return { ids: ids, place: place };
    },
    savePrintSettings: function (p) {
      if (JSON.stringify(p).length > 45000) throw new Error('รูปโลโก้ใหญ่เกินไป — ลองใช้รูปที่เล็กลง');
      db.print = copy(p);
      return { ok: true, print: copy(p) };
    },

    importAll: function (p) {
      if (!p || p.app !== 'school-timetable' || !p.terms || !p.teachers || !p.subjects) throw new Error('ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบนี้');
      db = { school: p.school || '', terms: p.terms, teachers: p.teachers, subjects: p.subjects,
        schedules: p.schedules || {}, print: p.print || {}, fixed: p.fixed || [], timetable: p.timetable || [] };
      return { ok: true };
    },
    resetAll: function () { db = seedDb(); return { ok: true }; },
    // เหมือน rpc/unlock ใน Code.gs: เปิดพรีวิวด้วย #locked เพื่อทดสอบรหัสผ่าน (รหัส = preview)
    unlock: function (pw) {
      if (pw !== 'preview') throw new Error('รหัสผ่านไม่ถูกต้อง');
      return { token: 'preview-token' };
    },
    rpc: function (name, args, token) {
      mockToken = token;
      if (locked() && name !== 'getData' && token !== 'preview-token') throw new Error('ไม่มีสิทธิ์แก้ไข — กด "เข้าโหมดแก้ไข" แล้วใส่รหัสผ่าน');
      return api[name].apply(null, args || []);
    }
  };

  var READ_ONLY = { getData: 1, exportReport: 1 };
  function runner(ok, fail) {
    var r = {
      withSuccessHandler: function (f) { return runner(f, fail); },
      withFailureHandler: function (f) { return runner(ok, f); }
    };
    Object.keys(api).forEach(function (k) {
      r[k] = function () {
        var args = copy(Array.prototype.slice.call(arguments));
        setTimeout(function () {
          var backup = JSON.stringify(db);
          try {
            var v = api[k].apply(null, args);
            if (!READ_ONLY[k]) save();
            ok && ok(copy(v));
          } catch (e) {
            db = JSON.parse(backup);
            fail && fail(e);
          }
        }, window.OFFLINE ? 0 : 150);
      };
    });
    return r;
  }
  window.google = { script: { get run() { return runner(null, null); } } };
  // ให้ firebase-backend.js ใช้กฎชุดนี้กับข้อมูลจาก Firestore
  window.__backend = { api: api, getDb: function () { return db; }, setDb: function (d) { db = d; } };
})();

</script>
<script>
// ฐานข้อมูล Firestore สำหรับหน้าเว็บบน GitHub Pages: แทน google.script.run โดยใช้กฎการแก้ข้อมูลชุดเดียวกับ mock.js
// โครงสร้าง (เก็บเป็นสตริง JSON ในฟิลด์ json เอกสารละไม่เกิน 1 MB):
//   app/main          = { school, terms, schedules, print, lastBackup }
//   terms/<termId>    = { teachers, subjects, fixed, timetable } ของภาคเรียนนั้น
//   app/rev           = { rev, by } เปลี่ยนทุกครั้งที่บันทึก เพื่อแจ้งเครื่องอื่นให้โหลดใหม่
//   logs/<auto>       = ประวัติการแก้ไข
//   backups/d01..d31  = สำรองอัตโนมัติวันละครั้ง (เขียนทับวันเดียวกันของเดือนถัดไป)
(function () {
  var backend = window.__backend;
  firebase.initializeApp(FIREBASE_CONFIG);
  var fs = firebase.firestore(), auth = firebase.auth();
  var CLIENT = Math.random().toString(16).slice(2);
  var TERM_KEYS = ['teachers', 'subjects', 'fixed', 'timetable'];

  var mainRef = fs.collection('app').doc('main'), revRef = fs.collection('app').doc('rev');
  function termRef(id) { return fs.collection('terms').doc(String(id)); }
  function parse(snap) { return snap.exists ? JSON.parse(snap.data().json) : null; }

  var authReady = new Promise(function (resolve) {
    var done = auth.onAuthStateChanged(function () { done(); resolve(); });
  });
  function canEdit() { return !!(auth.currentUser && auth.currentUser.email === EDITOR_EMAIL); }

  function emptyDb() { return { school: '', terms: [], schedules: {}, print: {}, teachers: [], subjects: [], fixed: [], timetable: [] }; }
  /** รวมเอกสารหลักกับเอกสารภาคเรียน เป็นก้อน db ที่กฎใน mock.js ใช้ */
  function assemble(main, termDocs) {
    var db = emptyDb();
    if (!main) return db;
    db.school = main.school || ''; db.terms = main.terms || []; db.schedules = main.schedules || {}; db.print = main.print || {};
    termDocs.forEach(function (t) { if (t) TERM_KEYS.forEach(function (k) { db[k] = db[k].concat(t[k] || []); }); });
    return db;
  }
  /** แยก db กลับเป็นสตริงของแต่ละเอกสาร เพื่อเขียนเฉพาะเอกสารที่เปลี่ยน */
  function split(db, lastBackup) {
    var out = { main: JSON.stringify({ school: db.school, terms: db.terms, schedules: db.schedules, print: db.print, lastBackup: lastBackup || '' }), terms: {} };
    db.terms.forEach(function (t) {
      var part = {};
      TERM_KEYS.forEach(function (k) { part[k] = db[k].filter(function (x) { return String(x.termId) === String(t.id); }); });
      out.terms[t.id] = JSON.stringify(part);
    });
    return out;
  }

  function getData() {
    return authReady.then(function () { return mainRef.get(); }).then(function (mainSnap) {
      var main = parse(mainSnap);
      return Promise.all(((main && main.terms) || []).map(function (t) { return termRef(t.id).get(); })).then(function (snaps) {
        backend.setDb(assemble(main, snaps.map(parse)));
        var d = backend.api.getData();
        d.user = ''; d.canEdit = canEdit(); d.sheetUrl = ''; d.offline = false; d.firebase = true; d.empty = !main;
        return d;
      });
    });
  }

  /** คำสั่งแก้ข้อมูล: อ่านล่าสุดใน transaction > ใช้กฎเดิม > เขียนเฉพาะเอกสารที่เปลี่ยน (พลาดจุดไหนก็ไม่บันทึกเลย) */
  function write(name, args) {
    if (!canEdit()) return Promise.reject(new Error('ไม่มีสิทธิ์แก้ไข — กด "เข้าโหมดแก้ไข" แล้วใส่รหัสผ่าน'));
    return fs.runTransaction(function (tx) {
      return tx.get(mainRef).then(function (mainSnap) {
        var main = parse(mainSnap);
        var ids = ((main && main.terms) || []).map(function (t) { return t.id; });
        return Promise.all(ids.map(function (id) { return tx.get(termRef(id)); })).then(function (snaps) {
          var termDocs = snaps.map(parse), before = assemble(main, termDocs);
          var today = new Date().toISOString().slice(0, 10), lastBackup = (main && main.lastBackup) || '';
          var oldParts = split(before, lastBackup);
          // สำรองก่อนแก้ครั้งแรกของวัน
          if (main && lastBackup !== today) {
            tx.set(fs.collection('backups').doc('d' + today.slice(8)), { at: new Date().toISOString(), json: JSON.stringify(before) });
            lastBackup = today;
          }
          backend.setDb(JSON.parse(JSON.stringify(before)));
          var result = backend.api[name].apply(null, args);
          var parts = split(backend.getDb(), lastBackup);
          if (parts.main !== oldParts.main || !main) tx.set(mainRef, { json: parts.main });
          Object.keys(parts.terms).forEach(function (id) {
            if (parts.terms[id] !== oldParts.terms[id]) tx.set(termRef(id), { json: parts.terms[id] });
          });
          // ภาคเรียนที่ไม่อยู่แล้ว (จากการนำเข้าไฟล์สำรอง)
          ids.forEach(function (id) { if (!(id in parts.terms)) tx.delete(termRef(id)); });
          tx.set(revRef, { rev: Date.now(), by: CLIENT });
          tx.set(fs.collection('logs').doc(), { at: new Date().toISOString(), action: name, detail: name === 'importAll' ? '' : JSON.stringify(args).slice(0, 500) });
          return result;
        });
      });
    });
  }

  function unlock(password) {
    return auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).then(function () {
      return auth.signInWithEmailAndPassword(EDITOR_EMAIL, String(password));
    }).then(function () {
      return { token: 'firebase' };
    }).catch(function (e) {
      var c = e && e.code;
      if (c === 'auth/too-many-requests') throw new Error('ใส่รหัสผิดหลายครั้งเกินไป รอสักครู่แล้วลองใหม่');

      throw e;
    });
  }
  window.fbSignOut = function () { return auth.signOut(); };

  // เครื่องอื่นบันทึก > โหลดข้อมูลใหม่
  revRef.onSnapshot(function (snap) {
    var v = snap.data();
    if (v && v.by !== CLIENT && window.onRemoteChange) window.onRemoteChange();
  }, function () { /* อ่านไม่ได้ก็ยังกดรีเฟรชเองได้ */ });

  function friendly(e) {
    if (e && e.code === 'permission-denied') return new Error('Firebase ไม่อนุญาตให้ทำรายการนี้ (ตรวจกฎความปลอดภัยหรือการเข้าโหมดแก้ไข)');
    return e;
  }
  function run(ok, fail) {
    return {
      withSuccessHandler: function (f) { return run(f, fail); },
      withFailureHandler: function (f) { return run(ok, f); },
      unlock: function (pw) { unlock(pw).then(ok, fail); },
      rpc: function (name, args) {
        var job = name === 'getData' ? getData() : write(name, JSON.parse(JSON.stringify(args || [])));
        job.then(function (v) { ok && ok(JSON.parse(JSON.stringify(v))); }, function (e) { fail && fail(friendly(e)); });
      }
    };
  }
  window.google = { script: { get run() { return run(null, null); } } };
})();

<script>

  subjLevel: 'all', subjQ: '', repTeacher: 'all', repLevel: 'all',
  ttMode: 'class', ttClass: '', ttTeacher: '', sel: null, lastAuto: null,
  prMode: 'class', prWho: 'all', prLayout: 'portrait', prDraft: null, prOpen: false,
  pending: 0
};
var ROOMS = ['room1', 'room2', 'room3'];

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

/* ------------------------------------------------------------ server */
// URL เว็บแอป Apps Script — ใช้เมื่อหน้านี้โฮสต์ที่อื่น (GitHub Pages) ซึ่งไม่มี google.script.run
var API_URL = 'https://script.google.com/macros/s/AKfycbx3OaOrtLakUi7oqu1E4dFSTg3WlFL1dExT0uqh0WSO_pcz35K9dtsVBydvJiIuPmjpxQ/exec';
function hosted() { return !(window.google && google.script); }

function postApi(method, args) {
  // ส่งแบบ text/plain และไม่แนบคุกกี้ Google จึงไม่มีปัญหาล็อกอินหลายบัญชี
  return fetch(API_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ method: method, args: args, token: S.token || '' }) })
    .then(function (res) {
      if (!res.ok) throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ (' + res.status + ')');
      return res.json();
    }).then(function (out) {
      if (!out.ok) throw new Error(out.error);
      return out.result;
    }).catch(function (e) { throw e && e.message ? e.message : String(e); });
}

function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (hosted()) return postApi(fn, args);
  return new Promise(function (resolve, reject) {
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
      reject(e && e.message ? e.message : String(e));
    });
    r.rpc(fn, args, S.token || '');
  });
}

/* ------------------------------------------------------------ โหมดแก้ไข (รหัสผ่าน) */
function saveToken(t) {
  S.token = t;
  try { if (t) sessionStorage.setItem('editToken', t); else sessionStorage.removeItem('editToken'); } catch (e) { /* จำไม่ได้ก็ใส่รหัสใหม่ตอนรีเฟรช */ }
}
function unlockForm() {

    '<button class="btn primary" id="ulGo">เข้าสู่ระบบ</button><button class="btn" data-close>ปิด</button></div>');

/* ------------------------------------------------------------ helpers */
function esc(v) {
  return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function $(id) { return document.getElementById(id); }
function num(v) { return Math.round(v * 100) / 100; }
function fullName(t) { return t ? t.prefix + t.firstName + ' ' + t.lastName : '(ไม่พบครู)'; }
function shortName(t) { return t ? 'ครู' + t.firstName : '(ไม่พบครู)'; }
function byOrder(a, b) { return a.order - b.order || String(a.id).localeCompare(String(b.id)); }

function toast(msg, bad) {
  var t = $('toast');
  t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast._h);
  toast._h = setTimeout(function () { t.className = ''; }, bad ? 5000 : 2200);
}

function term() { return S.data.terms.filter(function (t) { return String(t.id) === S.termId; })[0]; }
function teachers() { return S.data.teachers.filter(function (t) { return String(t.termId) === S.termId; }).sort(byOrder); }
function subjects() { return S.data.subjects.filter(function (s) { return String(s.termId) === S.termId; }).sort(byOrder); }
function teacherMap() { var m = {}; teachers().forEach(function (t) { m[t.id] = t; }); return m; }

function roomsOf(s) { return ROOMS.map(function (k) { return s[k] || ''; }); }
function assignedCount(s) { return roomsOf(s).filter(Boolean).length; }
function perRoom(s) { return num(s.unit * 2); }
/** ห้องที่เรียนวิชานี้จริง: ปกติคือ /1../จำนวนห้อง แต่ถ้ามีครูอยู่ห้องเกินจำนวนนั้น (เช่น 1 ห้อง ครูอยู่ /2 = เรียนเฉพาะ /2) ให้ยึดห้องที่มีครู */
function realRooms(s) {
  var n = Math.min(s.rooms, 3), base = [], over = false;
  for (var r = 1; r <= 3; r++) {
    if (r <= n) base.push(r);
    else if (s['room' + r]) over = true;
  }
  return over ? [1, 2, 3].filter(function (x) { return s['room' + x]; }) : base;
}
/** ห้องที่ติ๊กเรียนรวม (ต้อง 2 ห้องขึ้นไปจึงนับ) */
function combinedRooms(s) {
  var c = String(s.combine || '').split(',').map(Number).filter(function (r, i, a) { return r >= 1 && r <= Math.min(s.rooms, 3) && a.indexOf(r) === i; });
  return c.length >= 2 ? c.sort() : [];
}
/** ห้องที่เรียนพร้อมกับห้อง /room (ตัวเองถ้าไม่ได้เรียนรวม) */
function groupOf(s, room) { var c = combinedRooms(s); return c.indexOf(room) >= 0 ? c : [room]; }
/** กลุ่มการสอนของวิชา: ห้องที่เรียนรวมนับเป็นกลุ่มเดียว (ครูสอนครั้งเดียว) */
function teachGroups(s) {
  var out = [], done = {};
  realRooms(s).forEach(function (r) {
    if (done[r]) return;
    var g = groupOf(s, r);
    g.forEach(function (x) { done[x] = 1; });
    out.push({ rooms: g, tid: s['room' + g[0]] || '', combined: g.length > 1 });
  });
  return out;
}
function totalPeriods(s) { return num(teachGroups(s).length * s.unit * 2); }

/** เงื่อนไขการจัดอัตโนมัติที่ติ๊กให้แต่ละวิชาได้ (แท็บรายวิชา) */
var TAGS = [
  { key: 'morning', label: 'ช่วงเช้า', hint: 'วิชายาก เช่น คณิต — จัดไว้คาบก่อนเที่ยง' },
  { key: 'double', label: 'คาบคู่', hint: 'เช่น ฟิสิกส์ ชีวะ เคมี — จัด 2 คาบติดกันวันเดียวกัน 1 ครั้ง/สัปดาห์ (ที่เหลือเป็นคาบเดี่ยว)' },
  { key: 'pe', label: 'พละ', hint: 'พลศึกษา — คาบสุดท้ายของวัน หรือคาบก่อนพักเที่ยง' },
  { key: 'agri', label: 'เกษตร', hint: 'เกษตร — คาบสุดท้ายของวัน' }
];
function tagsOf(s) { return String(s.tags || '').split(',').filter(Boolean); }
function status(s) {
  var n = assignedCount(s);
  if (n === s.rooms) return 'ok';
  return n < s.rooms ? 'incomplete' : 'over';
}

/** แยกวิชาตามครู ตามลำดับครู — เหมือนมาโคร VCR03 เดิม */
function groups(s, tOrder) {
  var rooms = roomsOf(s), by = {};
  rooms.forEach(function (tid, i) { if (tid) (by[tid] = by[tid] || []).push(i + 1); });
  return Object.keys(by).sort(function (a, b) {
    var ta = tOrder[a], tb = tOrder[b];
    return (ta === undefined ? 1e9 : ta) - (tb === undefined ? 1e9 : tb);
  }).map(function (tid) {
    var tg = teachGroups(s).filter(function (g) { return g.tid === tid; });
    return { tid: tid, rooms: by[tid], label: roomLabel(s.level, by[tid], s), periods: num(tg.length * s.unit * 2) };
  });
}
function roomLabel(level, rooms, s) {
  var c = s ? combinedRooms(s) : [];
  var comb = rooms.some(function (r) { return c.indexOf(r) >= 0; });
  return 'ม.' + rooms.map(function (r) { return level + '/' + r; }).join(', ') + (comb ? ' (เรียนรวม)' : '');
}
function tOrderMap() { var m = {}; teachers().forEach(function (t, i) { m[t.id] = i; }); return m; }

function loads() {
  var m = {}, cnt = {};
  teachers().forEach(function (t) { m[t.id] = 0; cnt[t.id] = 0; });
  subjects().forEach(function (s) {
    var seen = {};
    // ห้องที่เรียนรวมนับคาบครูครั้งเดียว
    teachGroups(s).forEach(function (g) {
      var tid = g.tid;
      if (!tid) return;
      m[tid] = num((m[tid] || 0) + s.unit * 2);
      if (!seen[tid]) { cnt[tid] = (cnt[tid] || 0) + 1; seen[tid] = 1; }
    });
  });
  return { periods: m, subjects: cnt };
}

function levels() {
  var set = {};
  subjects().forEach(function (s) { set[s.level] = 1; });
  return Object.keys(set).map(Number).sort(function (a, b) { return a - b; });
}

function problems() {
  var tm = teacherMap(), out = [];
  subjects().forEach(function (s) {
    var n = assignedCount(s);
    if (n < s.rooms) out.push({ kind: 'bad', s: s, text: (n === 0 ? 'ยังไม่มีครูสอน' : 'กำหนดครูแล้ว ' + n + ' จาก ' + s.rooms + ' ห้อง') });
    else if (n > s.rooms) out.push({ kind: 'warn', s: s, text: 'กำหนดครู ' + n + ' ห้อง แต่วิชานี้มี ' + s.rooms + ' ห้อง (จำนวนคาบจะเกิน)' });
    roomsOf(s).forEach(function (tid) { if (tid && !tm[tid]) out.push({ kind: 'bad', s: s, text: 'อ้างถึงครูที่ไม่มีในรายชื่อ (' + tid + ')' }); });
  });
  var L = loads().periods;
  teachers().forEach(function (t) { if (!L[t.id]) out.push({ kind: 'info', t: t, text: 'ยังไม่มีคาบสอน' }); });
  return out;
}

    teachers: viewTeachers, subjects: viewSubjects, settings: viewSettings };

/* ------------------------------------------------------------ ภาพรวม */
function viewOverview(v) {
  var subs = subjects(), ts = teachers(), L = loads(), probs = problems();
  var total = subs.reduce(function (a, s) { return a + totalPeriods(s); }, 0);
  var assigned = Object.keys(L.periods).reduce(function (a, k) { return a + L.periods[k]; }, 0);
  var done = subs.filter(function (s) { return status(s) === 'ok'; }).length;
  var max = Math.max.apply(null, ts.map(function (t) { return L.periods[t.id] || 0; }).concat([1]));

  var html = '<div class="stats">' +
    stat(subs.length, 'รายวิชา') +
    stat(done + ' / ' + subs.length, 'วิชาที่กำหนดครูครบ', done === subs.length ? 'ok' : 'bad') +
    stat(num(assigned) + ' / ' + num(total), 'คาบที่มีครูสอน / คาบทั้งหมด', assigned === total ? 'ok' : 'bad') +
    stat(ts.length, 'ครู') + '</div>';

  html += '<div class="panel"><h2>สิ่งที่ต้องตรวจสอบ</h2>';
  if (!probs.length) html += '<p class="status-ok">✓ ข้อมูลครบถ้วน ไม่มีรายการที่ต้องแก้</p>';
  else html += '<ul class="warn-list">' + probs.map(function (p) {
    if (p.s) return '<li class="' + p.kind + '"><b>' + esc(p.s.code) + '</b> ' + esc(p.s.name) + ' (ม.' + p.s.level + ') — ' + esc(p.text) +
      ' <a data-goto="' + esc(p.s.id) + '">ไปที่วิชานี้</a></li>';
    return '<li class="info"><b>' + esc(fullName(p.t)) + '</b> — ' + esc(p.text) + '</li>';
  }).join('') + '</ul>';
  html += '</div>';

  html += '<div class="panel"><h2>ภาระการสอนของครู (คาบ/สัปดาห์)</h2><div class="scroll"><table><thead><tr>' +
    '<th class="num">ที่</th><th>ชื่อครู</th><th class="num">จำนวนวิชา</th><th class="num">คาบรวม</th><th style="width:40%"></th></tr></thead><tbody>' +
    ts.map(function (t, i) {
      var p = L.periods[t.id] || 0;
      return '<tr><td class="num">' + (i + 1) + '</td><td>' + esc(fullName(t)) + '</td><td class="num">' + (L.subjects[t.id] || 0) +
        '</td><td class="num"><b>' + p + '</b></td><td><div class="bar"><span style="width:' + (p / max * 100) + '%"></span></div></td></tr>';
    }).join('') + '</tbody></table></div></div>';
  v.innerHTML = html;

  Array.prototype.forEach.call(v.querySelectorAll('[data-goto]'), function (a) {
    a.onclick = function () {
      var s = S.data.subjects.filter(function (x) { return x.id === a.dataset.goto; })[0];
      S.tab = 'assign'; S.level = String(s.level); S.q = s.code; S.onlyIncomplete = false; render();
    };
  });
}
function stat(v, l, cls) { return '<div class="stat ' + (cls || '') + '"><div class="v">' + esc(v) + '</div><div class="l">' + esc(l) + '</div></div>'; }

/* ------------------------------------------------------------ มอบหมายครู */
function levelChips(cur, attr) {
  return '<div class="chips">' + ['all'].concat(levels()).map(function (l) {
    return '<button class="chip' + (String(l) === String(cur) ? ' active' : '') + '" ' + attr + '="' + l + '">' + (l === 'all' ? 'ทุกชั้น' : 'ม.' + l) + '</button>';
  }).join('') + '</div>';
}

function filterSubjects(level, q, onlyIncomplete) {
  q = (q || '').trim().toLowerCase();
  var tm = teacherMap();
  return subjects().filter(function (s) {
    if (level !== 'all' && String(s.level) !== String(level)) return false;
    if (onlyIncomplete && status(s) === 'ok') return false;
    if (!q) return true;
    var names = roomsOf(s).map(function (tid) { return tm[tid] ? fullName(tm[tid]) : ''; }).join(' ');
    return (s.code + ' ' + s.name + ' ' + s.note + ' ' + names).toLowerCase().indexOf(q) >= 0;
  });
}

function viewAssign(v) {

    }).join('') + (sel && !ts.some(function (t) { return t.id === sel; }) ? '<option value="' + esc(sel) + '" selected>(ไม่พบครู)</option>' : '');
  };
  var html = '<div class="panel"><div class="toolbar">' + levelChips(S.level, 'data-level') +

    '<label><input type="checkbox" id="onlyInc"' + (S.onlyIncomplete ? ' checked' : '') + '> เฉพาะที่ยังไม่ครบ</label>' +

    '<div class="scroll"><table><thead><tr><th class="num">ที่</th><th>รหัส</th><th>ชื่อวิชา</th><th class="num">ชั้น</th><th class="num">หน่วยกิต</th>' +
    '<th class="num">จำนวนห้อง</th><th class="num">คาบ/ห้อง</th><th>ห้อง /1</th><th>ห้อง /2</th><th>ห้อง /3</th><th>สถานะ</th></tr></thead><tbody>';
  html += list.map(function (s) {

      '</td><td class="num">' + s.rooms + '</td><td class="num">' + perRoom(s) + '</td>' +
      ROOMS.map(function (k, i) {
        var raw = String(s.combine || '').split(',');
        return '<td><select data-edit data-sid="' + esc(s.id) + '" data-room="' + i + '" aria-label="ม.' + s.level + '/' + (i + 1) + '">' + opts(s[k]) + '</select>' +
          (s.rooms >= 2 && i < s.rooms ? '<label class="comb" title="ติ๊กห้องที่เรียนรวมกัน (2 ห้องขึ้นไป) ครูคนเดียวสอนพร้อมกัน นับคาบครั้งเดียว">' +
            '<input type="checkbox" data-edit data-comb="' + esc(s.id) + '" data-croom="' + (i + 1) + '"' + (raw.indexOf(String(i + 1)) >= 0 ? ' checked' : '') + '> เรียนรวม</label>' : '') +
          '</td>';
      }).join('') + '<td>' + label + (combinedRooms(s).length ? '<br><span class="badge edit">รวม ' + combinedRooms(s).map(function (r) { return '/' + r; }).join('+') + '</span>' : '') + '</td></tr>';
  }).join('') || '<tr><td colspan="11" class="muted">ไม่พบรายวิชา</td></tr>';
  html += '</tbody></table></div></div>';
  v.innerHTML = html;

  bindLevelChips(v, 'data-level', function (l) { S.level = l; });
  var q = $('q');
  q.oninput = function () { S.q = q.value; clearTimeout(q._t); q._t = setTimeout(function () { render(); var n = $('q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  $('onlyInc').onchange = function () { S.onlyIncomplete = this.checked; render(); };
  Array.prototype.forEach.call(v.querySelectorAll('select[data-sid]'), function (sel) { sel.onchange = function () { saveRoom(sel); }; });
  each(v, '[data-comb]', function (cb) { cb.onchange = function () { saveCombine(cb); }; });
}

/** ติ๊ก/เลิกติ๊กเรียนรวม — ห้องที่รวมกันใช้ครูคนแรกที่กำหนดไว้ */
function saveCombine(cb) {
  var s = findS(cb.dataset.comb), room = Number(cb.dataset.croom);
  var raw = String(s.combine || '').split(',').map(Number).filter(Boolean).filter(function (r) { return r !== room; });
  if (cb.checked) raw.push(room);
  raw.sort();
  var rooms = roomsOf(s);
  if (raw.length >= 2) {
    var tid = raw.map(function (r) { return rooms[r - 1]; }).filter(Boolean)[0] || '';
    raw.forEach(function (r) { rooms[r - 1] = tid; });
  }
  var placed = S.data.timetable.some(function (l) { return l.subjectId === s.id && raw.concat([room]).indexOf(l.room) >= 0; });
  S.pending++;
  api('saveRooms', s.id, rooms, s.updatedAt, raw.join(',')).then(function (res) {
    S.pending--;
    replaceSubject(res.row);
    if (res.conflict) toast('มีคนอื่นแก้ไขวิชา ' + s.code + ' ไปก่อนแล้ว — แสดงข้อมูลล่าสุดแทน', true);
    else if (raw.length === 1) toast('ติ๊กอีกอย่างน้อย 1 ห้องเพื่อเรียนรวม');
    else toast(raw.length >= 2 ? s.code + ' ม.' + raw.map(function (r) { return s.level + '/' + r; }).join('+') + ' เรียนรวม — นับคาบครูครั้งเดียว' +
      (placed ? ' (ตรวจตารางที่ลงไว้แล้วในแท็บจัดตาราง)' : '') : 'ยกเลิกเรียนรวม ' + s.code);
    render();
  }).catch(function (e) { S.pending--; toast('บันทึกไม่สำเร็จ: ' + e, true); render(); });
}

function bindLevelChips(v, attr, set) {
  Array.prototype.forEach.call(v.querySelectorAll('[' + attr + ']'), function (b) {
    b.onclick = function () { set(b.getAttribute(attr)); render(); };
  });
}

function saveRoom(sel) {
  var s = S.data.subjects.filter(function (x) { return x.id === sel.dataset.sid; })[0];
  var rooms = roomsOf(s);
  var prev = rooms.slice();
  // ห้องที่เรียนรวมกันเปลี่ยนครูพร้อมกัน
  groupOf(s, Number(sel.dataset.room) + 1).forEach(function (r) { rooms[r - 1] = sel.value; });
  sel.classList.add('saving'); sel.disabled = true; S.pending++;
  api('saveRooms', s.id, rooms, s.updatedAt).then(function (res) {
    S.pending--;
    replaceSubject(res.row);
    if (res.conflict) toast('มีคนอื่นแก้ไขวิชา ' + s.code + ' ไปก่อนแล้ว — แสดงข้อมูลล่าสุดแทน ลองเลือกใหม่อีกครั้ง', true);
    else toast('บันทึก ' + s.code + ' แล้ว');
    render();
  }).catch(function (e) {
    S.pending--;
    ROOMS.forEach(function (k, i) { s[k] = prev[i]; });
    toast('บันทึกไม่สำเร็จ: ' + e, true);
    render();
  });
}

function replaceSubject(row) {
  var i = S.data.subjects.findIndex(function (x) { return x.id === row.id; });
  if (i >= 0) S.data.subjects[i] = row; else S.data.subjects.push(row);
}
function replaceTeacher(row) {
  var i = S.data.teachers.findIndex(function (x) { return x.id === row.id; });
  if (i >= 0) S.data.teachers[i] = row; else S.data.teachers.push(row);
}

/* ------------------------------------------------------------ จัดตาราง */
function classes() {
  var max = {}, out = [];
  subjects().forEach(function (s) { max[s.level] = Math.max.apply(null, [max[s.level] || 0].concat(realRooms(s))); });
  Object.keys(max).map(Number).sort(function (a, b) { return a - b; }).forEach(function (l) {
    for (var r = 1; r <= max[l]; r++) out.push({ level: l, room: r, key: l + '/' + r });
  });
  return out;
}
function needPeriods(s) { return Math.round(s.unit * 2); }
/** สถานที่เรียนของวิชานี้ในห้อง /room (เอาจากคาบที่ลงไว้คาบแรกที่มีค่า) */
function placeOf(sid, room) {
  var l = lessonsOf().filter(function (x) { return x.subjectId === sid && x.room === room && x.place; })[0];
  return l ? l.place : '';
}
function teacherOf(s, room) { return s['room' + room] || ''; }
function fixedApplies(f, level, room) { return !f.level || (f.level === level && (!f.room || f.room === room)); }
function slotKey(day, period) { return day + '-' + period; }

/** ดัชนีของตารางทั้งภาคเรียน: ช่องของแต่ละห้อง, ช่องของแต่ละครู, จำนวนคาบที่ลงแล้ว และรายการที่มีปัญหา */
function ttIndex() {
  var sm = {}, sch = schedule(), ix = { sch: sch, cell: {}, byTeacher: {}, count: {}, orphans: [] };
  subjects().forEach(function (s) { sm[s.id] = s; });
  ix.sm = sm;
  lessonsOf().forEach(function (l) {
    var s = sm[l.subjectId];
    if (!s) return ix.orphans.push({ l: l, why: 'รายวิชาถูกลบไปแล้ว' });
    var k = s.id + '#' + l.room;
    ix.count[k] = (ix.count[k] || 0) + 1;
    if (outside(l, sch)) return ix.orphans.push({ l: l, s: s, why: 'อยู่นอกวัน/คาบที่ตั้งไว้ (' + (DAY_NAMES[l.day] || '?') + ' คาบ ' + l.period + ')' });
    if (realRooms(s).indexOf(l.room) < 0) ix.orphans.push({ l: l, s: s, why: 'วิชานี้ตั้งไว้ ' + s.rooms + ' ห้อง แต่ลงตารางห้อง /' + l.room });
    var g = groupOf(s, l.room);
    // ev = การสอนหนึ่งครั้ง: ห้องที่เรียนรวมในช่องเดียวกันนับเป็นครั้งเดียว (ไม่ถือว่าครูสอนซ้อน)
    var info = { l: l, s: s, level: s.level, room: l.room, tid: teacherOf(s, l.room), ev: g.length > 1 ? s.id + '#' + g.join('+') : l.id };
    var ck = s.level + '/' + l.room + '@' + slotKey(l.day, l.period);
    (ix.cell[ck] = ix.cell[ck] || []).push(info);
    if (info.tid) {
      var tk = info.tid + '@' + slotKey(l.day, l.period);
      (ix.byTeacher[tk] = ix.byTeacher[tk] || []).push(info);
    }
  });
  return ix;
}

function eventCount(list) {
  var seen = {};
  (list || []).forEach(function (x) { seen[x.ev] = 1; });
  return Object.keys(seen).length;
}

function ttProblems(ix) {
  var tm = teacherMap(), out = [];
  Object.keys(ix.byTeacher).forEach(function (k) {
    var list = ix.byTeacher[k];
    if (eventCount(list) < 2) return;
    var l = list[0].l;
    out.push({ kind: 'warn', text: shortName(tm[list[0].tid]) + ' สอนซ้อนกัน ' + DAY_NAMES[l.day] + ' คาบ ' + l.period + ': ' +
      list.map(function (x) { return x.s.code + ' ม.' + x.level + '/' + x.room; }).join(', '), go: { teacher: list[0].tid } });
  });
  Object.keys(ix.cell).forEach(function (k) {
    var list = ix.cell[k];
    if (list.length < 2) return;
    var l = list[0].l;
    out.push({ kind: 'bad', text: 'ม.' + list[0].level + '/' + list[0].room + ' มีหลายวิชาในช่องเดียวกัน ' + DAY_NAMES[l.day] + ' คาบ ' + l.period, go: { cls: list[0].level + '/' + list[0].room } });
  });
  ix.orphans.forEach(function (o) {
    out.push({ kind: 'bad', text: (o.s ? o.s.code + ' ม.' + o.s.level + '/' + o.l.room + ': ' : '') + o.why, lid: o.l.id });
  });
  // ห้องที่เรียนรวมต้องลงช่องเดียวกัน
  subjects().forEach(function (s) {
    var c = combinedRooms(s);
    if (!c.length) return;
    var sig = c.map(function (r) {
      return lessonsOf().filter(function (l) { return l.subjectId === s.id && l.room === r; }).map(function (l) { return slotKey(l.day, l.period); }).sort().join(',');
    });
    if (sig.some(function (x) { return x !== sig[0]; })) {
      out.push({ kind: 'warn', text: s.code + ' ม.' + c.map(function (r) { return s.level + '/' + r; }).join('+') + ' เรียนรวม แต่ลงตารางคนละช่อง — ย้ายให้ตรงกัน', go: { cls: s.level + '/' + c[0] } });
    }
  });
  return out;
}

/** รายการที่ต้องลงของห้องหรือครูที่เลือก */
function ttNeeds(ix) {
  var out = [];
  if (S.ttMode === 'teacher') {
    // ห้องที่เรียนรวมแสดงเป็นรายการเดียว
    subjects().forEach(function (s) {
      teachGroups(s).forEach(function (g) { if (g.tid === S.ttTeacher) out.push({ s: s, room: g.rooms[0] }); });
    });
  } else {
    var c = S.ttClass.split('/').map(Number);
    subjects().forEach(function (s) { if (s.level === c[0] && realRooms(s).indexOf(c[1]) >= 0) out.push({ s: s, room: c[1] }); });
  }
  out.forEach(function (n) {
    n.need = needPeriods(n.s); n.placed = ix.count[n.s.id + '#' + n.room] || 0; n.tid = teacherOf(n.s, n.room);
    n.group = groupOf(n.s, n.room);
  });
  return out;
}

/**
 * ตรวจว่าวางวิชา s ห้อง /room (รวมห้องที่เรียนรวมด้วย) ลงช่องนี้ได้ไหม — no = ห้าม, warn = ครูสอนซ้อน (ถามยืนยัน)
 * moveIds = คาบที่กำลังย้าย (ไม่นับว่าขวางตัวเอง)
 */
function slotCheck(ix, s, room, day, period, moveIds) {
  moveIds = moveIds || [];
  var notMoving = function (x) { return moveIds.indexOf(x.l.id) < 0; };
  var g = groupOf(s, room);
  for (var i = 0; i < g.length; i++) {
    var r = g[i];
    var fx = fixedOf().filter(function (f) { return f.day === day && f.period === period && fixedApplies(f, s.level, r); })[0];
    if (fx) return { level: 'no', why: (g.length > 1 ? 'ม.' + s.level + '/' + r + ' ' : '') + 'ล็อกไว้สำหรับ ' + fx.label };
    var here = (ix.cell[s.level + '/' + r + '@' + slotKey(day, period)] || []).filter(notMoving);
    if (here.length) return { level: 'no', why: 'ม.' + s.level + '/' + r + ' มี ' + here[0].s.code + ' ในช่องนี้แล้ว' };
  }
  var tid = teacherOf(s, room);
  var busy = tid ? (ix.byTeacher[tid + '@' + slotKey(day, period)] || []).filter(notMoving) : [];
  if (busy.length) return { level: 'warn', why: shortName(teacherMap()[tid]) + ' สอน ' + busy[0].s.code + ' ม.' + busy[0].level + '/' + busy[0].room + ' ในคาบนี้อยู่แล้ว' };
  var tfx = fixedOf().filter(function (f) { return f.level < 0 && f.day === day && f.period === period; })[0];
  if (tid && tfx) return { level: 'warn', why: 'คาบนี้ครูมีกิจกรรม ' + tfx.label };
  return { level: 'ok', why: 'วางได้' };
}

/** สิ่งที่เลือกไว้: วิชาที่จะวางใหม่ หรือคาบที่จะย้าย */
function ttSelection(ix) {
  if (!S.sel) return null;
  if (S.sel.lid) {
    var l = lessonsOf().filter(function (x) { return x.id === S.sel.lid; })[0];
    var s = l && ix.sm[l.subjectId];
    return s ? { s: s, room: l.room, group: groupOf(s, l.room), moveId: l.id, moveIds: groupLessons(l).map(function (x) { return x.id; }) } : null;
  }
  var s2 = ix.sm[S.sel.sid];
  return s2 ? { s: s2, room: S.sel.room, group: groupOf(s2, S.sel.room), moveId: null, moveIds: [] } : null;
}

/** คาบ l และคาบของห้องที่เรียนรวมกับมันในช่องเดียวกัน (ย้าย/ลบไปพร้อมกัน) */
function groupLessons(l) {
  var s = findS(l.subjectId);
  var g = s ? groupOf(s, l.room) : [l.room];
  return lessonsOf().filter(function (x) {
    return x.id === l.id || (x.subjectId === l.subjectId && g.indexOf(x.room) >= 0 && x.day === l.day && x.period === l.period);
  });
}
function groupLabel(s, g) { return 'ม.' + g.map(function (r) { return s.level + '/' + r; }).join('+') + (g.length > 1 ? ' (เรียนรวม)' : ''); }

function viewTimetable(v) {
  var ix = ttIndex(), sch = ix.sch, tm = teacherMap(), cls = classes(), ts = teachers();
  if (!cls.some(function (c) { return c.key === S.ttClass; })) S.ttClass = cls.length ? cls[0].key : '';
  if (!tm[S.ttTeacher]) S.ttTeacher = ts.length ? ts[0].id : '';
  var isT = S.ttMode === 'teacher';
  var sel = ttSelection(ix);
  if (!sel) S.sel = null;
  var needs = ttNeeds(ix), probs = ttProblems(ix);
  var totNeed = 0, totPlaced = 0;
  subjects().forEach(function (s) {
    realRooms(s).forEach(function (r) { totNeed += needPeriods(s); totPlaced += Math.min(ix.count[s.id + '#' + r] || 0, needPeriods(s)); });
  });
  var myNeed = needs.reduce(function (a, n) { return a + n.need; }, 0), myPlaced = needs.reduce(function (a, n) { return a + Math.min(n.placed, n.need); }, 0);
  var pageLs = pageLessons(ix);

  var html = '<div class="panel"><div class="toolbar"><div class="chips">' +
    '<button class="chip' + (!isT ? ' active' : '') + '" data-mode="class">ตามห้องเรียน</button>' +
    '<button class="chip' + (isT ? ' active' : '') + '" data-mode="teacher">ตามครู</button></div>';
  if (isT) {
    html += '<select id="ttWho">' + ts.map(function (t) { return '<option value="' + esc(t.id) + '"' + (t.id === S.ttTeacher ? ' selected' : '') + '>' + esc(fullName(t)) + '</option>'; }).join('') + '</select>';
  } else {
    html += '<select id="ttWho">' + cls.map(function (c) { return '<option value="' + c.key + '"' + (c.key === S.ttClass ? ' selected' : '') + '>ม.' + c.key + '</option>'; }).join('') + '</select>';
  }
  html += '<button class="btn small" id="ttPrev" title="ก่อนหน้า">◀</button><button class="btn small" id="ttNext" title="ถัดไป">▶</button>' +
    '<button class="btn primary" data-edit id="ttAuto">⚡ จัดอัตโนมัติ</button>' +
    (S.lastAuto && S.lastAuto.termId === S.termId ? '<button class="btn" data-edit id="ttUndo">↶ เลิกทำการจัดอัตโนมัติ (' + S.lastAuto.ids.length + ')</button>' : '') +
    (pageLs.length ? '<button class="btn danger" data-edit id="ttClear">🗑 เอาออกทั้งหมด</button>' : '') +
    '<span class="spacer"></span><span class="muted">ลงแล้ว <b>' + myPlaced + ' / ' + myNeed + '</b> คาบ · ทั้งภาคเรียน ' + totPlaced + ' / ' + totNeed + '</span></div>';

  if (sel) {
    html += '<div class="tt-hint">กำลัง' + (sel.moveId ? 'ย้าย' : 'วาง') + ' <b>' + esc(sel.s.code) + ' ' + esc(sel.s.name) + '</b> ' + groupLabel(sel.s, sel.group) +
      ' — คลิกช่อง <span class="key ok">ว่าง</span> <span class="key warn">ครูสอนซ้อน</span> <span class="key no">ลงไม่ได้</span>' +
      ' <button class="btn small" id="ttCancel">ยกเลิก (Esc)</button></div>';
  } else if (S.data.canEdit) {
    html += '<p class="muted" style="margin:0 0 8px">เลือกวิชาจากรายการด้านขวา แล้วคลิกช่องในตาราง · คลิกคาบในตารางเพื่อย้าย · กด × เพื่อเอาออก · กด 📍 ที่รายการด้านขวาเพื่อเลือกห้องเรียน (ห้องคอม ฯลฯ)</p>';
  }

  html += '<div class="tt-layout"><div class="scroll">' + gridHtml(sch, function (day, no) {
    var out = '';
    fixedOf().forEach(function (f) {
      if (f.day !== day || f.period !== no) return;
      var c = S.ttClass.split('/').map(Number);
      if (isT ? f.level <= 0 : fixedApplies(f, c[0], c[1])) out += '<div class="fx">' + esc(f.label) + '</div>';
    });
    var list = isT ? ix.byTeacher[S.ttTeacher + '@' + slotKey(day, no)] : ix.cell[S.ttClass + '@' + slotKey(day, no)];
    (list || []).forEach(function (x) {
      var clash = (x.tid && eventCount(ix.byTeacher[x.tid + '@' + slotKey(day, no)]) > 1) || (ix.cell[x.level + '/' + x.room + '@' + slotKey(day, no)] || []).length > 1;
      var comb = groupOf(x.s, x.room).length > 1;
      out += '<div class="ls' + (clash ? ' clash' : '') + (sel && sel.moveIds.indexOf(x.l.id) >= 0 ? ' moving' : '') + '" data-lid="' + esc(x.l.id) + '" title="' + esc(x.s.code + ' ' + x.s.name) + '">' +
        '<b>' + esc(x.s.code) + '</b><small>' + esc(isT ? 'ม.' + x.level + '/' + x.room : (x.tid ? shortName(tm[x.tid]) : 'ยังไม่มีครู')) + (comb ? ' · รวม' : '') + (x.l.place ? ' · ' + esc(x.l.place) : '') + '</small>' +
        (S.data.canEdit ? '<button class="x" data-rml="' + esc(x.l.id) + '" title="เอาออก">×</button>' : '') + '</div>';
    });
    return out;
  }, function (day, no) {
    var a = ' data-d="' + day + '" data-p="' + no + '"';
    if (!sel) return a;
    var chk = slotCheck(ix, sel.s, sel.room, day, no, sel.moveIds);
    return a + ' class="slot-' + chk.level + '" title="' + esc(chk.why) + '"';
  }) + '</div>';

  html += '<div class="needs"><h3>' + (isT ? 'วิชาที่ครูคนนี้สอน' : 'วิชาของ ม.' + esc(S.ttClass)) + '</h3>' + (needs.map(function (n) {
    var active = sel && !sel.moveId && sel.s.id === n.s.id && sel.group.indexOf(n.room) >= 0;
    var done = n.placed >= n.need;
    return '<button class="need' + (done ? ' done' : '') + (active ? ' active' : '') + (n.placed > n.need ? ' over' : '') + '" data-edit data-nsid="' + esc(n.s.id) + '" data-nroom="' + n.room + '">' +
      '<span class="cnt">' + n.placed + '/' + n.need + '</span><b>' + esc(n.s.code) + '</b> ' + esc(n.s.name) +
      '<small>' + (isT ? groupLabel(n.s, n.group) : (n.tid ? esc(fullName(tm[n.tid])) : '<span class="status-bad">ยังไม่มีครู</span>') +
        (n.group.length > 1 ? ' · เรียนรวม ' + groupLabel(n.s, n.group).replace(' (เรียนรวม)', '') : '')) + '</small>' +
      (n.placed ? '<span class="pl" data-place="' + esc(n.s.id) + '" data-proom="' + n.room + '" title="ตั้งห้อง/สถานที่เรียน">📍 ' + esc(placeOf(n.s.id, n.room) || 'ห้อง' + n.s.level + '/' + n.room) + '</span>' : '') +
      '</button>';
  }).join('') || '<p class="muted">ไม่มีวิชา</p>') + '</div></div></div>';

  if (probs.length) {
    html += '<div class="panel"><h2>ตรวจตาราง (' + probs.length + ')</h2><ul class="warn-list">' + probs.map(function (p, i) {
      return '<li class="' + p.kind + '">' + esc(p.text) + (p.go ? ' <a data-pgo="' + i + '">ไปดู</a>' : '') +
        (p.lid && S.data.canEdit ? ' <a data-prm="' + esc(p.lid) + '">เอาคาบนี้ออก</a>' : '') + '</li>';
    }).join('') + '</ul></div>';
  }
  v.innerHTML = html;

  each(v, '[data-mode]', function (b) { b.onclick = function () { S.ttMode = b.dataset.mode; S.sel = null; store('ttMode', S.ttMode); render(); }; });
  var pick = function (val) { if (isT) S.ttTeacher = val; else S.ttClass = val; if (S.sel && S.sel.sid) S.sel = null; render(); };
  $('ttWho').onchange = function () { pick(this.value); };
  var step = function (d) {
    var sel2 = $('ttWho'), i = sel2.selectedIndex + d;
    if (i >= 0 && i < sel2.options.length) pick(sel2.options[i].value);
  };
  $('ttPrev').onclick = function () { step(-1); };
  $('ttNext').onclick = function () { step(1); };
  if ($('ttCancel')) $('ttCancel').onclick = function () { S.sel = null; render(); };
  $('ttAuto').onclick = autoForm;
  if ($('ttUndo')) $('ttUndo').onclick = undoAuto;
  if ($('ttClear')) $('ttClear').onclick = function () { clearPage(pageLs, isT ? fullName(tm[S.ttTeacher]) : 'ม.' + S.ttClass); };

  each(v, '[data-place]', function (sp) {
    sp.onclick = function (e) {
      e.stopPropagation();
      if (!S.data.canEdit) return;
      placeForm(findS(sp.dataset.place), Number(sp.dataset.proom));
    };
  });
  each(v, '[data-nsid]', function (b) {
    b.onclick = function () {
      var same = S.sel && S.sel.sid === b.dataset.nsid && S.sel.room === Number(b.dataset.nroom);
      S.sel = same ? null : { sid: b.dataset.nsid, room: Number(b.dataset.nroom) };
      render();
    };
  });
  each(v, '.ls[data-lid]', function (el) {
    el.onclick = function (e) {
      if (e.target.closest('[data-rml]') || !S.data.canEdit) return;
      e.stopPropagation();
      S.sel = S.sel && S.sel.lid === el.dataset.lid ? null : { lid: el.dataset.lid };
      render();
    };
  });
  each(v, '[data-rml]', function (b) { b.onclick = function (e) { e.stopPropagation(); removeLesson(b.dataset.rml); }; });
  each(v, 'td[data-d]', function (td) {
    td.onclick = function () { if (S.sel) placeAt(Number(td.dataset.d), Number(td.dataset.p)); };
  });
  each(v, '[data-pgo]', function (a) {
    a.onclick = function () {
      var g = probs[Number(a.dataset.pgo)].go;
      if (g.teacher) { S.ttMode = 'teacher'; S.ttTeacher = g.teacher; } else { S.ttMode = 'class'; S.ttClass = g.cls; }
      S.sel = null; render(); window.scrollTo(0, 0);
    };
  });
  each(v, '[data-prm]', function (a) { a.onclick = function () { removeLesson(a.dataset.prm); }; });
}

function placeAt(day, period) {
  var ix = ttIndex(), sel = ttSelection(ix);
  if (!sel) return;
  var chk = slotCheck(ix, sel.s, sel.room, day, period, sel.moveIds);
  if (chk.level === 'no') return toast(chk.why, true);
  if (chk.level === 'warn' && !confirm(chk.why + '\n\nวางซ้อนต่อไหม?')) return;
  var placed = ix.count[sel.s.id + '#' + sel.room] || 0, need = needPeriods(sel.s);
  if (!sel.moveId && placed >= need && !confirm(sel.s.code + ' ' + groupLabel(sel.s, sel.group) + ' ลงครบ ' + need + ' คาบแล้ว\n\nเพิ่มอีกคาบไหม?')) return;
  var upsert = function (row) {
    var i = S.data.timetable.findIndex(function (x) { return x.id === row.id; });
    if (i >= 0) S.data.timetable[i] = row; else S.data.timetable.push(row);
  };
  var job;
  if (sel.moveId) {
    // ย้ายทีละคาบ (ห้องที่เรียนรวมย้ายไปด้วย)
    var moving = lessonsOf().filter(function (x) { return sel.moveIds.indexOf(x.id) >= 0; });
    job = moving.reduce(function (p, l) {
      return p.then(function () {
        return api('placeLesson', { id: l.id, termId: S.termId, subjectId: l.subjectId, room: l.room, day: day, period: period }).then(function (res) { upsert(res.row); });
      });
    }, Promise.resolve());
  } else {
    var list = sel.group.map(function (r) { return { subjectId: sel.s.id, room: r, day: day, period: period, place: placeOf(sel.s.id, r) }; });
    job = api('placeLessons', S.termId, list).then(function (res) { res.rows.forEach(upsert); });
  }
  S.pending++;
  job.then(function () {
    S.pending--;
    // วางครบแล้ว หรือย้ายเสร็จ → เลิกเลือก
    if (sel.moveId || placed + 1 >= need) S.sel = null;
    render();
  }).catch(function (e) { S.pending--; toast('วางไม่สำเร็จ: ' + e, true); render(); });
}

/** เลือกห้อง/สถานที่เรียนจากรายการ (ห้องคอม ฯลฯ) — ห้องที่เรียนรวมได้ห้องเดียวกัน */
function placeForm(s, room) {
  var cur = placeOf(s.id, room), group = groupOf(s, room), list = printCfg().places.slice();
  var savePlaces = function () {
    var p = JSON.parse(JSON.stringify(printCfg()));
    p.places = list;
    return api('savePrintSettings', p).then(function (res) { S.data.print = res.print; });
  };
  var choose = function (place) {
    closeModal();
    group.reduce(function (job, r) {
      return job.then(function () { return api('setPlace', S.termId, s.id, r, place); }).then(function (res) {
        S.data.timetable.forEach(function (l) { if (res.ids.indexOf(l.id) >= 0) l.place = res.place; });
      });
    }, Promise.resolve()).then(function () {
      toast('บันทึกแล้ว'); render();
    }).catch(function (err) { toast('บันทึกไม่สำเร็จ: ' + err, true); });
  };
  var draw = function () {
    var shown = cur && list.indexOf(cur) < 0 ? [cur].concat(list) : list;
    openModal('<h3>📍 ห้อง/สถานที่เรียน</h3><p class="muted" style="margin-top:0">' + esc(s.code + ' ' + s.name) + ' ' + groupLabel(s, group) + ' · ใช้กับทุกคาบของวิชานี้</p>' +
      '<div class="pl-list"><button class="chip' + (cur ? '' : ' active') + '" data-plc="">ห้องประจำ (ห้อง' + s.level + '/' + room + ')</button>' +
      shown.map(function (name) {
        return '<span class="chip' + (name === cur ? ' active' : '') + '"><button data-plc="' + esc(name) + '">' + esc(name) + '</button>' +
          (list.indexOf(name) >= 0 ? '<button class="pl-x" data-pldel="' + esc(name) + '" title="ลบออกจากรายการ">×</button>' : '') + '</span>';
      }).join('') + '</div>' +
      '<div class="toolbar" style="margin-top:12px"><input type="text" id="plNew" placeholder="เพิ่มห้องใหม่ เช่น ห้องคอม 2" maxlength="60"><button class="btn primary" id="plAdd">เพิ่มและเลือก</button>' +
      '<span class="spacer"></span><button class="btn" data-close>ปิด</button></div>');
    each($('modal'), '[data-plc]', function (b) { b.onclick = function () { choose(b.dataset.plc); }; });
    each($('modal'), '[data-pldel]', function (b) {
      b.onclick = function () {
        list = list.filter(function (n) { return n !== b.dataset.pldel; });
        savePlaces().then(draw).catch(function (err) { toast('บันทึกไม่สำเร็จ: ' + err, true); });
      };
    });
    var add = function () {
      var name = $('plNew').value.trim();
      if (!name) return $('plNew').focus();
      if (list.indexOf(name) < 0) list.push(name);
      savePlaces().then(function () { choose(name); }).catch(function (err) { toast('บันทึกไม่สำเร็จ: ' + err, true); });
    };
    $('plAdd').onclick = add;
    $('plNew').onkeydown = function (e) { if (e.key === 'Enter') add(); };
  };
  draw();
}

/** เอาคาบออก (ห้องที่เรียนรวมในช่องเดียวกันออกด้วย) */
function removeLesson(id) {
  var l = S.data.timetable.filter(function (x) { return x.id === id; })[0];
  var ids = l ? groupLessons(l).map(function (x) { return x.id; }) : [id];
  S.pending++;
  api('removeLessons', ids).then(function () {
    S.pending--;
    S.data.timetable = S.data.timetable.filter(function (x) { return ids.indexOf(x.id) < 0; });
    if (S.sel && ids.indexOf(S.sel.lid) >= 0) S.sel = null;
    render();
  }).catch(function (e) { S.pending--; toast('เอาออกไม่สำเร็จ: ' + e, true); });
}

/** คาบทั้งหมดในหน้าที่เปิดอยู่ (ห้องเรียน หรือ ครู) */
function pageLessons(ix) {
  var pre = (S.ttMode === 'teacher' ? S.ttTeacher : S.ttClass) + '@', src = S.ttMode === 'teacher' ? ix.byTeacher : ix.cell, out = [];
  Object.keys(src).forEach(function (k) {
    if (k.indexOf(pre) === 0) src[k].forEach(function (x) { if (out.indexOf(x.l) < 0) out.push(x.l); });
  });
  return out;
}

/** เอาคาบทั้งหน้าออก (ห้องที่เรียนรวมด้วยออกตามไป เพื่อไม่ให้คาบรวมแยกกัน) */
function clearPage(list, who) {
  var ids = [];
  list.forEach(function (l) { groupLessons(l).forEach(function (x) { if (ids.indexOf(x.id) < 0) ids.push(x.id); }); });
  var extra = ids.length - list.length;
  if (!confirm('เอาคาบทั้งหมดของ ' + who + ' ออก ' + list.length + ' คาบ?' +
    (extra > 0 ? '\n(รวมคาบเรียนรวมของห้องอื่นอีก ' + extra + ' คาบ)' : ''))) return;
  S.pending++;
  api('removeLessons', ids).then(function (res) {
    S.pending--;
    S.data.timetable = S.data.timetable.filter(function (x) { return ids.indexOf(x.id) < 0; });
    if (S.lastAuto) {
      S.lastAuto.ids = S.lastAuto.ids.filter(function (id) { return ids.indexOf(id) < 0; });
      if (!S.lastAuto.ids.length) S.lastAuto = null;
    }
    S.sel = null;
    toast('เอาออกแล้ว ' + res.removed + ' คาบ'); render();
  }).catch(function (e) { S.pending--; toast('เอาออกไม่สำเร็จ: ' + e, true); });
}

/* ------------------------------------------------------------ จัดอัตโนมัติ */
/**
 * วางคาบที่ยังขาดลงช่องว่าง โดยไม่แตะคาบที่วางไว้แล้ว
 * ห้ามเด็ดขาด: ห้องเรียนซ้อน, ครูซ้อน, ช่องที่ล็อกไว้ (รวมกิจกรรมของครูทุกคน)
 * พยายาม: วิชาเดียวกันไม่เรียนซ้ำวัน (เกินวันละ ceil(คาบ/จำนวนวัน)), ครูและห้องได้ภาระแต่ละวันใกล้กัน
 *   และตามเงื่อนไขที่ติ๊กไว้ในแท็บรายวิชา (opts.rules เปิด/ปิดแต่ละข้อ):
 *   morning = คาบก่อนเที่ยง · double = คาบคู่ 1 ครั้ง/สัปดาห์ · pe = คาบสุดท้ายหรือก่อนพักเที่ยง · agri = คาบสุดท้าย
 * ห้องที่เรียนรวมวางพร้อมกันเป็นหน่วยเดียว · สุ่มลำดับหลายรอบแล้วเก็บรอบที่ดีที่สุด
 */
function autoPlan(opts) {
  var ix = ttIndex(), sch = ix.sch, nP = classCount(sch), days = sch.days, sl = slots(sch);
  // adj[p] = คาบ p กับ p+1 ติดกันไม่มีช่วงพักคั่น · morning[p] = คาบที่เริ่มก่อน 12:00
  var adj = {}, morning = {}, lastMorning = 0, lastP = nP;
  sl.forEach(function (p, i) {
    if (p.type !== 'class') return;
    var nx = sl[i + 1];
    if (nx && nx.type === 'class') adj[p.no] = true;
    if (p.start < '12:00') { morning[p.no] = true; lastMorning = p.no; }
  });
  var rule = function (s, k) { return !!(opts.rules && opts.rules[k]) && tagsOf(s).indexOf(k) >= 0; };

  var units = [], skipped = [];
  subjects().forEach(function (s) {
    teachGroups(s).forEach(function (g) {
      var clsList = g.rooms.map(function (r) { return s.level + '/' + r; });
      if (opts.scope === 'class' && clsList.indexOf(S.ttClass) < 0) return;
      if (opts.scope === 'teacher' && g.tid !== S.ttTeacher) return;
      var need = needPeriods(s), placed = ix.count[s.id + '#' + g.rooms[0]] || 0, left = need - placed;
      if (left <= 0) return;
      if (!g.tid && opts.skipNoTeacher) { skipped.push({ s: s, rooms: g.rooms, n: left }); return; }
      var base = { s: s, rooms: g.rooms, clsList: clsList, tid: g.tid, need: need, maxDay: Math.ceil(need / days.length), key: s.id + '#' + g.rooms[0],
        place: g.rooms.map(function (r) { return placeOf(s.id, r); }), morning: rule(s, 'morning'), pe: rule(s, 'pe'), agri: rule(s, 'agri'), wantPair: false };
      if (rule(s, 'double') && left >= 2 && placed === 0) { units.push(Object.assign({}, base, { len: 2, wantPair: true })); left -= 2; }
      for (var k = 0; k < left; k++) units.push(Object.assign({}, base, { len: 1 }));
    });
  });

  // สภาพตารางตอนนี้ (คาบที่วางไว้แล้วถือว่าย้ายไม่ได้)
  var base = { cb: {}, tb: {}, sd: {}, td: {}, cd: {}, fixedC: {}, tFixed: {} };
  lessonsOf().forEach(function (l) {
    var s = ix.sm[l.subjectId];
    if (!s || outside(l, sch)) return;
    var k = slotKey(l.day, l.period), cls = s.level + '/' + l.room, g = groupOf(s, l.room), tid = teacherOf(s, l.room);
    base.cb[cls + '@' + k] = 'fixed';
    base.cd[cls + '@' + l.day] = (base.cd[cls + '@' + l.day] || 0) + 1;
    if (l.room !== g[0]) return; // ห้องที่เรียนรวมนับครู/วิชาครั้งเดียว
    if (tid) { base.tb[tid + '@' + k] = 'fixed'; base.td[tid + '@' + l.day] = (base.td[tid + '@' + l.day] || 0) + 1; }
    base.sd[s.id + '#' + g[0] + '@' + l.day] = (base.sd[s.id + '#' + g[0] + '@' + l.day] || 0) + 1;
  });
  var cls = classes();
  fixedOf().forEach(function (f) {
    var k = slotKey(f.day, f.period);
    if (f.level < 0) { base.tFixed[k] = f.label; return; }
    cls.forEach(function (c) { if (fixedApplies(f, c.level, c.room)) base.fixedC[c.key + '@' + k] = f.label; });
  });
  // ภาระทั้งหมดของครู (ใช้เรียงลำดับ: ครูที่สอนเยอะวางก่อน)
  var tLoad = {};
  units.forEach(function (u) { if (u.tid) tLoad[u.tid] = (tLoad[u.tid] || 0) + u.len; });

  function clone(o) { var c = {}; Object.keys(o).forEach(function (k) { c[k] = Object.assign({}, o[k]); }); return c; }
  function free(st, u, day, p) {
    for (var q = p; q < p + u.len; q++) {
      if (q > nP || (q > p && !adj[q - 1])) return false;
      var k = slotKey(day, q);
      for (var i = 0; i < u.clsList.length; i++) {
        if (st.fixedC[u.clsList[i] + '@' + k] || st.cb[u.clsList[i] + '@' + k]) return false;
      }
      if (u.tid && (st.tb[u.tid + '@' + k] || st.tFixed[k])) return false;
    }
    return true;
  }
  function put(st, u, day, p, on) {
    var d = on ? u.len : -u.len;
    for (var q = p; q < p + u.len; q++) {
      var k = slotKey(day, q);
      u.clsList.forEach(function (c) { if (on) st.cb[c + '@' + k] = u; else delete st.cb[c + '@' + k]; });
      if (u.tid) { if (on) st.tb[u.tid + '@' + k] = u; else delete st.tb[u.tid + '@' + k]; }
    }
    st.sd[u.key + '@' + day] = (st.sd[u.key + '@' + day] || 0) + d;
    if (u.tid) st.td[u.tid + '@' + day] = (st.td[u.tid + '@' + day] || 0) + d;
    u.clsList.forEach(function (c) { st.cd[c + '@' + day] = (st.cd[c + '@' + day] || 0) + d; });
    u.day = on ? day : 0; u.period = on ? p : 0;
  }
  /** คาบนี้ผิดเงื่อนไขที่ติ๊กไว้กี่ข้อ */
  function misses(u, p) {
    var end = p + u.len - 1, out = [];
    if (u.morning && !(morning[p] && morning[end])) out.push('morning');
    if (u.pe && end !== lastP && end !== lastMorning) out.push('pe');
    if (u.agri && end !== lastP) out.push('agri');
    return out;
  }
  function bestSlot(st, u, strict) {
    var best = null, bestScore = Infinity;
    days.forEach(function (day) {
      var same = st.sd[u.key + '@' + day] || 0;
      if (strict && (u.len > 1 ? same > 0 : same >= u.maxDay)) return;
      var cdMax = Math.max.apply(null, u.clsList.map(function (c) { return st.cd[c + '@' + day] || 0; }));
      for (var p = 1; p <= nP; p++) {
        if (!free(st, u, day, p)) continue;
        var score = same * 6 + (u.tid ? (st.td[u.tid + '@' + day] || 0) : 0) + cdMax * 0.4 + misses(u, p).length * 8 + Math.random() * 1.5;
        if (score < bestScore) { bestScore = score; best = { day: day, p: p }; }
      }
    });
    return best;
  }
  /** ช่องที่ถูกคาบอื่น (ที่จัดในรอบนี้) ขวางอยู่ 1 คาบ → ลองย้ายคาบนั้นไปช่องอื่น (เฉพาะคาบเดี่ยว ห้องเดียว) */
  function repair(st, u) {
    if (u.len !== 1 || u.clsList.length !== 1) return false;
    var c = u.clsList[0], tries = [];
    days.forEach(function (day) { for (var p = 1; p <= nP; p++) tries.push({ day: day, p: p, r: Math.random() }); });
    tries.sort(function (a, b) { return a.r - b.r; });
    for (var i = 0; i < tries.length; i++) {
      var t = tries[i], k = slotKey(t.day, t.p);
      if (st.fixedC[c + '@' + k] || (u.tid && st.tFixed[k])) continue;
      var bc = st.cb[c + '@' + k], bt = u.tid ? st.tb[u.tid + '@' + k] : null;
      var blockers = [bc, bt].filter(function (b, j, a) { return b && a.indexOf(b) === j; });
      if (blockers.length !== 1 || blockers[0] === 'fixed' || blockers[0].len !== 1 || blockers[0].clsList.length !== 1) continue;
      var b = blockers[0], od = b.day, op = b.period;
      put(st, b, od, op, false);
      if (free(st, u, t.day, t.p)) {
        put(st, u, t.day, t.p, true);
        var alt = bestSlot(st, b, true) || bestSlot(st, b, false);
        if (alt) { put(st, b, alt.day, alt.p, true); return true; }
        put(st, u, t.day, t.p, false);
      }
      put(st, b, od, op, true);
    }
    return false;
  }
  function attempt() {
    var st = clone(base);
    var list = units.map(function (u) { return Object.assign({}, u, { day: 0, period: 0, r: Math.random() }); });
    // คาบคู่และห้องเรียนรวมหาช่องยาก วางก่อน
    list.sort(function (a, b) {
      return (b.len + b.clsList.length) - (a.len + a.clsList.length) || (tLoad[b.tid] || 0) - (tLoad[a.tid] || 0) || b.need - a.need || a.r - b.r;
    });
    var unplaced = [], done = [], pairFailed = [];
    var place = function (u) {
      var slot = bestSlot(st, u, true) || bestSlot(st, u, false);
      if (slot) { put(st, u, slot.day, slot.p, true); done.push(u); return true; }
      if (repair(st, u)) { done.push(u); return true; }
      return false;
    };
    list.forEach(function (u) {
      if (place(u)) return;
      if (u.len === 2) {
        // หาคาบคู่ไม่ได้ → แยกเป็นคาบเดี่ยว 2 คาบ
        pairFailed.push(u);
        [0, 1].forEach(function () {
          var one = Object.assign({}, u, { len: 1, wantPair: false, day: 0, period: 0 });
          if (!place(one)) unplaced.push(one);
        });
        return;
      }
      unplaced.push(u);
    });
    var miss = 0;
    done.forEach(function (u) { u.miss = misses(u, u.period); miss += u.miss.length; });
    return { units: done, unplaced: unplaced, pairFailed: pairFailed, miss: miss };
  }

  var best = null, t0 = Date.now();
  for (var a = 0; a < 400 && Date.now() - t0 < 3000; a++) {
    var res = attempt();
    var worse = best && (res.unplaced.length > best.unplaced.length ||
      (res.unplaced.length === best.unplaced.length && res.miss + res.pairFailed.length >= best.miss + best.pairFailed.length));
    if (!worse) best = res;
    if (!best.unplaced.length && !best.miss && !best.pairFailed.length) break;
  }
  best.skipped = skipped;
  best.total = units.length;
  best.periods = best.units.reduce(function (n, u) { return n + u.len; }, 0);
  // คาบที่จะบันทึก: ทุกห้องในกลุ่มเรียนรวม × ทุกคาบของคาบคู่
  best.lessons = [];
  best.units.forEach(function (u) {
    u.rooms.forEach(function (r, i) {
      for (var q = u.period; q < u.period + u.len; q++) best.lessons.push({ subjectId: u.s.id, room: r, day: u.day, period: q, place: u.place[i] });
    });
  });

  // ห้องที่มีคาบต้องเรียนมากกว่าช่องที่มี — จัดยังไงก็ไม่ครบ ต้องแก้ข้อมูลที่แท็บมอบหมายครู/รายวิชา
  best.overfull = cls.filter(function (c) { return best.unplaced.some(function (u) { return u.clsList.indexOf(c.key) >= 0; }); }).map(function (c) {
    var need = 0, cap = 0;
    subjects().forEach(function (s) { if (s.level === c.level && realRooms(s).indexOf(c.room) >= 0) need += needPeriods(s); });
    days.forEach(function (day) { for (var p = 1; p <= nP; p++) if (!base.fixedC[c.key + '@' + slotKey(day, p)]) cap++; });
    return { key: c.key, need: need, cap: cap };
  }).filter(function (o) { return o.need > o.cap; });
  return best;
}

var AUTO_RULES = [
  { key: 'morning', label: 'วิชายาก (ติ๊ก "ช่วงเช้า") ไว้คาบก่อนเที่ยง' },
  { key: 'double', label: 'วิชาที่ติ๊ก "คาบคู่" (เช่น ฟิสิกส์ ชีวะ เคมี) จัด 2 คาบติดกัน 1 ครั้ง/สัปดาห์' },
  { key: 'pe', label: 'พลศึกษา (ติ๊ก "พละ") ไว้คาบสุดท้ายของวัน หรือคาบก่อนพักเที่ยง' },
  { key: 'agri', label: 'เกษตร (ติ๊ก "เกษตร") ไว้คาบสุดท้ายของวัน' }
];
function autoRules() {

function autoForm() {
  var isT = S.ttMode === 'teacher', tm = teacherMap(), rules = autoRules();

    '<p class="muted" style="margin-top:0">วางคาบที่ยังขาดลงช่องว่าง โดยไม่ย้ายคาบที่วางไว้แล้ว · ไม่ให้ครูหรือห้องเรียนซ้อนกัน · ไม่ลงทับช่องที่ล็อกไว้ · กระจายวิชาเดียวกันไปคนละวัน · ห้องที่เรียนรวมวางพร้อมกัน</p>' +
    '<div class="form-grid">' +
    field('จัดให้', '<select id="auScope"><option value="' + (isT ? 'teacher' : 'class') + '">เฉพาะ' + esc(who) + '</option><option value="all">ทั้งภาคเรียน (ทุกห้อง)</option></select>') +
    field('', '<label><input type="checkbox" id="auSkip" checked> ข้ามวิชาที่ยังไม่มีครู</label>') +
    '</div><h3 style="margin:14px 0 6px">เงื่อนไขเพิ่มเติม <span class="muted" style="font-weight:400;font-size:13px">(พยายามให้ได้ ถ้าไม่ได้จะแจ้ง · ติ๊กวิชาได้ที่แท็บรายวิชา)</span></h3><div class="au-rules">' +
    AUTO_RULES.map(function (r) {
      var n = tagged(r.key);

    }).join('') + '</div><div id="auResult"></div>' +
    '<div class="actions"><button class="btn" data-close>ปิด</button><button class="btn" id="auRun">คำนวณ</button><button class="btn primary" id="auSave" disabled>บันทึก</button></div>');
  each($('modal'), '[data-rule]', function (cb) {
    cb.onchange = function () { rules[cb.dataset.rule] = cb.checked; store('autoRules', JSON.stringify(rules)); };
  });
  var plan = null;
  $('auRun').onclick = function () {
    $('auResult').innerHTML = '<p class="muted">กำลังคำนวณ…</p>';
    setTimeout(function () {

      var nMiss = plan.miss + plan.pairFailed.length;
      var h = '<div class="stats" style="margin:14px 0 8px"><div class="stat ok"><div class="v">' + plan.periods + '</div><div class="l">คาบที่จะวาง</div></div>' +
        '<div class="stat' + (plan.unplaced.length ? ' bad' : '') + '"><div class="v">' + plan.unplaced.length + '</div><div class="l">วางไม่ได้</div></div>' +
        '<div class="stat' + (nMiss ? ' bad' : '') + '"><div class="v">' + nMiss + '</div><div class="l">ไม่ตรงเงื่อนไข</div></div></div>';
      if (!plan.total && !plan.skipped.length) h += '<p class="status-ok">✓ ลงครบทุกคาบแล้ว ไม่มีอะไรต้องจัด</p>';
      var group = function (list, fmt) {
        var m = {};
        list.forEach(function (u) { var k = u.s.id + '#' + u.rooms[0]; (m[k] = m[k] || { u: u, n: 0 }).n += u.n || u.len || 1; });
        return Object.keys(m).map(function (k) { return fmt(m[k].u, m[k].n); });
      };
      var who2 = function (u) { return u.tid ? esc(shortName(tm[u.tid])) : 'ไม่มีครู'; };
      if (plan.overfull.length) {
        h += '<div class="banner err" style="margin:8px 0">' + plan.overfull.map(function (o) {
          return '<b>ม.' + o.key + '</b> มีคาบที่ต้องเรียน ' + o.need + ' คาบ/สัปดาห์ แต่มีช่องว่างแค่ ' + o.cap + ' ช่อง';
        }).join('<br>') + '<br>ตรวจที่แท็บรายวิชา/มอบหมายครู ว่าวิชาของห้องอื่น (เช่น สายศิลป์) ถูกนับเป็นห้องนี้หรือไม่</div>';
      }
      if (plan.unplaced.length) {
        h += '<p class="status-bad" style="margin-bottom:4px">วางไม่ได้ (ไม่มีช่องที่ครูและห้องว่างพร้อมกัน — ต้องย้ายคาบอื่นเองหรือลดกิจกรรมที่ล็อกไว้):</p><ul class="err-list" style="margin-top:0">' +
          group(plan.unplaced, function (u, n) { return '<li>' + esc(u.s.code + ' ' + u.s.name) + ' ' + groupLabel(u.s, u.rooms) + ' (' + who2(u) + ') ' + n + ' คาบ</li>'; }).join('') + '</ul>';
      }
      if (nMiss) {
        var why = { morning: 'ไม่ได้ช่วงเช้า', pe: 'ไม่ได้คาบสุดท้าย/ก่อนเที่ยง', agri: 'ไม่ได้คาบสุดท้าย' };
        var items = plan.pairFailed.map(function (u) { return esc(u.s.code) + ' ' + groupLabel(u.s, u.rooms) + ' — หาคาบคู่ไม่ได้ จัดเป็นคาบเดี่ยวแทน'; });
        plan.units.forEach(function (u) {
          u.miss.forEach(function (m) { items.push(esc(u.s.code) + ' ' + groupLabel(u.s, u.rooms) + ' ' + DAY_NAMES[u.day] + ' คาบ ' + u.period + ' — ' + why[m]); });
        });
        h += '<p class="status-warn" style="margin-bottom:4px">วางได้แต่ไม่ตรงเงื่อนไข (ย้ายเองได้ในตาราง):</p><ul style="margin-top:0">' +
          items.slice(0, 30).map(function (t) { return '<li>' + t + '</li>'; }).join('') + (items.length > 30 ? '<li>… อีก ' + (items.length - 30) + ' รายการ</li>' : '') + '</ul>';
      }
      if (plan.skipped.length) {
        h += '<p class="muted" style="margin-bottom:4px">ข้ามเพราะยังไม่มีครู:</p><ul style="margin-top:0">' +
          group(plan.skipped, function (u, n) { return '<li>' + esc(u.s.code + ' ' + u.s.name) + ' ' + groupLabel(u.s, u.rooms) + ' ' + n + ' คาบ</li>'; }).join('') + '</ul>';
      }
      $('auResult').innerHTML = h;
      $('auSave').disabled = !plan.lessons.length;
      $('auSave').textContent = 'บันทึก ' + plan.periods + ' คาบ';
      $('auRun').textContent = 'คำนวณใหม่';
    }, 30);
  };
  $('auSave').onclick = function () {
    if (!plan || !plan.lessons.length) return;
    var btn = this; btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
    S.pending++;
    api('placeLessons', S.termId, plan.lessons).then(function (res) {
      S.pending--;
      S.data.timetable = S.data.timetable.concat(res.rows);
      S.lastAuto = { termId: S.termId, ids: res.rows.map(function (r) { return r.id; }) };
      closeModal(); S.sel = null;
      toast('วางอัตโนมัติแล้ว ' + plan.periods + ' คาบ');
      render();
    }).catch(function (e) {
      S.pending--; btn.disabled = false; btn.textContent = 'บันทึก';
      toast('บันทึกไม่สำเร็จ: ' + e + ' — กดคำนวณใหม่', true);
    });
  };
  $('auRun').click();
}

function undoAuto() {
  var la = S.lastAuto;
  if (!la || !confirm('เอาคาบที่จัดอัตโนมัติครั้งล่าสุดออก ' + la.ids.length + ' คาบ?')) return;
  S.pending++;
  api('removeLessons', la.ids).then(function (res) {
    S.pending--;
