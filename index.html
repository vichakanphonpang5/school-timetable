    toast('เอาออกแล้ว ' + res.removed + ' คาบ'); render();
  }).catch(function (e) { S.pending--; toast('ไม่สำเร็จ: ' + e, true); });
}

/* ------------------------------------------------------------ พิมพ์ตาราง */
var PRINT_DEFAULT = { logo: '', color: '', signLeft: 'รองผอ.ฝ่ายวิชาการ', signRight: 'ผู้อำนวยการโรงเรียน', classRooms: {}, places: ['ห้องคอม', 'ห้องวิทยาศาสตร์', 'ห้องสมุด', 'สนามกีฬา'] };
function printCfg() {
  var p = S.data.print || {}, out = {};
  Object.keys(PRINT_DEFAULT).forEach(function (k) { out[k] = p[k] === undefined || p[k] === '' ? PRINT_DEFAULT[k] : p[k]; });
  return out;
}
function levelGroup(l) { return l <= 3 ? 'มัธยมศึกษาตอนต้น' : 'มัธยมศึกษาตอนปลาย'; }
function normClass(h) { return String(h || '').replace(/ม\.|\s/g, ''); }
function classRoomText(key) { return printCfg().classRooms[key] || 'ห้อง ' + key; }

/** ช่องของตารางเรียนห้อง c: รายการบรรทัดในแต่ละช่อง + สรุปวิชา/กิจกรรม */
function classSheetData(c, ix) {
  var tm = teacherMap(), cells = {}, used = 0, subj = {}, act = {}, nClass = classCount(ix.sch);
  ix.sch.days.forEach(function (day) {
    for (var no = 1; no <= nClass; no++) {
      var k = slotKey(day, no), items = [];
      (ix.cell[c.key + '@' + k] || []).forEach(function (x) {
        items.push([x.s.code, x.tid ? shortName(tm[x.tid]) : '', x.l.place || 'ห้อง' + c.key]);
        var e = subj[x.s.id] = subj[x.s.id] || { s: x.s, tid: x.tid, n: 0 };
        e.n++;
      });
      fixedOf().forEach(function (f) {
        if (f.day !== day || f.period !== no || !fixedApplies(f, c.level, c.room)) return;
        items.push([f.label]);
        act[f.label] = (act[f.label] || 0) + 1;
      });
      if (items.length) used++;
      cells[k] = items;
    }
  });
  var sum = Object.keys(subj).map(function (k) { return subj[k]; }).sort(function (a, b) { return byOrder(a.s, b.s); }).map(function (e) {
    return [e.s.code, e.tid ? shortName(tm[e.tid]) : '', e.n];
  }).concat(Object.keys(act).map(function (l) { return [l, '', act[l]]; }));
  return { cells: cells, count: used, sum: sum };
}

/** ช่องของตารางสอนครู t — วิชาเดียวกันหลายห้องในช่องเดียวกัน = เรียนรวม */
function teacherSheetData(t, ix) {
  var cells = {}, used = 0, subj = {}, act = {}, nClass = classCount(ix.sch);
  ix.sch.days.forEach(function (day) {
    for (var no = 1; no <= nClass; no++) {
      var k = slotKey(day, no), items = [], bySubj = {};
      (ix.byTeacher[t.id + '@' + k] || []).forEach(function (x) { (bySubj[x.s.id] = bySubj[x.s.id] || []).push(x); });
      Object.keys(bySubj).forEach(function (sid) {
        var g = bySubj[sid], s = g[0].s;
        if (g.length === 1) items.push([s.code, s.level + '/' + g[0].room, g[0].l.place || 'ห้อง' + s.level + '/' + g[0].room]);
        else {
          var lv = g.map(function (x) { return x.level; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
          items.push([s.code, 'ม.' + lv.join(','), g[0].l.place || 'เรียนรวม']);
        }
        var e = subj[sid] = subj[sid] || { s: s, rooms: {}, n: 0 };
        e.n++;
        g.forEach(function (x) { e.rooms[x.room] = (e.rooms[x.room] || 0) + 1; });
      });
      fixedOf().forEach(function (f) {
        if (f.day !== day || f.period !== no || f.level > 0) return;
        items.push([f.label]);
        act[f.label] = (act[f.label] || 0) + 1;
      });
      if (items.length) used++;
      cells[k] = items;
    }
  });
  var lines = Object.keys(subj).map(function (k) { return subj[k]; }).sort(function (a, b) { return byOrder(a.s, b.s); });
  return { cells: cells, count: used, lines: lines, act: act };
}

function sheetGrid(sch, cells) {
  var sl = slots(sch);
  var h = '<table class="sh-grid"><colgroup><col style="width:9%">' + sl.map(function (p) { return '<col' + (p.type === 'break' ? ' style="width:9%"' : '') + '>'; }).join('') + '</colgroup>' +
    '<thead><tr><th>คาบ</th>' + sl.map(function (p) { return '<th>' + (p.type === 'class' ? p.no : esc(p.label || 'พัก')) + '</th>'; }).join('') + '</tr>' +
    '<tr><th>เวลา</th>' + sl.map(function (p) { return '<th>' + showTime(p.start) + '-' + showTime(p.end) + '</th>'; }).join('') + '</tr></thead><tbody>';
  sch.days.forEach(function (day) {
    h += '<tr><th>' + DAY_NAMES[day] + '</th>' + sl.map(function (p) {
      if (p.type !== 'class') return '<td class="brk"></td>';
      return '<td>' + (cells[slotKey(day, p.no)] || []).map(function (it) {
        return '<div class="it">' + it.filter(Boolean).map(esc).join('<br>') + '</div>';
      }).join('') + '</td>';
    }).join('') + '</tr>';
  });
  return h + '</tbody></table>';
}

function sheetHead(lines) {
  var cfg = printCfg();
  return '<div class="sh-head">' + (cfg.logo ? '<img src="' + esc(cfg.logo) + '" alt="">' : '') + lines.map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('') + '</div>';
}
function sheetSign() {
  var cfg = printCfg();
  return '<div class="sh-sign">ลงชื่อ.............................' + esc(cfg.signLeft) + '&nbsp;&nbsp; ลงชื่อ.............................' + esc(cfg.signRight) + '</div>';
}
function colorText() { var c = printCfg().color; return c ? '  คณะสี ' + c : ''; }

function classSheetHtml(c, ix) {
  var d = classSheetData(c, ix);
  var adv = teachers().filter(function (t) { return normClass(t.homeroom) === c.key; }).map(fullName).join(' ');
  var head = [S.data.school, 'ตารางเรียน' + term().label + '  กลุ่ม/สาย ' + levelGroup(c.level) + colorText(),
    'ชั้น ม. ' + c.key + '  ห้องเรียนประจำ ' + classRoomText(c.key) + '  จำนวนคาบ ' + d.count + (adv ? '  ชื่อครูที่ปรึกษา ' + adv : '')];
  var per = 12, sum = '<table class="sh-sum">';
  for (var i = 0; i < d.sum.length; i += per) {
    var row = d.sum.slice(i, i + per);
    while (row.length < per) row.push(null);
    sum += '<tr>' + row.map(function (e) { return '<td>' + (e ? esc(e[0]) + '<br>' + esc(e[1]) + '<br>' + e[2] : '') + '</td>'; }).join('') + '</tr>';
  }
  sum += '</table>';
  return '<div class="sheet">' + sheetHead(head) + sheetGrid(ix.sch, d.cells) +
    (d.sum.length ? '<div class="sh-cap"><span>วิชาที่เรียน</span></div>' + sum : '') + sheetSign() + '</div>';
}

function teacherSheetHtml(t, ix) {
  var d = teacherSheetData(t, ix), hr = normClass(t.homeroom);
  var head = [S.data.school, 'ตารางสอน' + term().label + colorText(),
    'ชื่อ-สกุล ' + fullName(t) + '  จำนวนคาบ ' + d.count + (hr ? '  ครูที่ปรึกษาชั้น ม.' + hr : '')];
  var list = '<div class="sh-cap"><span>วิชาที่สอน</span><span>ชั้น [รวม]</span><span>รวม</span></div><div class="sh-list">' +
    d.lines.map(function (e, i) {
      var rooms = Object.keys(e.rooms).map(function (r) { return e.s.level + '/' + r + ' [' + e.rooms[r] + ']'; }).join('&nbsp;&nbsp;&nbsp; ');
      return '<div><span>' + (i + 1) + ') ' + esc(e.s.code) + ' (' + esc(e.s.name) + ')</span><span>' + rooms + '</span><span>' + e.n + '</span></div>';
    }).join('');
  var acts = Object.keys(d.act);
  if (acts.length) {
    list += '<div class="other"><span>อื่นๆ ' + acts.map(function (l) { return esc(l) + ' [' + d.act[l] + ']'; }).join(' ') + '</span><span>' +
      acts.reduce(function (a, l) { return a + d.act[l]; }, 0) + '</span></div>';
  }
  list += '</div>';
  return '<div class="sheet">' + sheetHead(head) + sheetGrid(ix.sch, d.cells) + list + sheetSign() + '</div>';
}

function viewPrint(v) {
  var ix = ttIndex(), isT = S.prMode === 'teacher', land = S.prLayout === 'landscape';
  var targets = isT ? teachers() : classes();
  var keyOf = function (x) { return isT ? x.id : x.key; };
  if (S.prWho !== 'all' && !targets.some(function (x) { return keyOf(x) === S.prWho; })) S.prWho = 'all';
  var list = S.prWho === 'all' ? targets : targets.filter(function (x) { return keyOf(x) === S.prWho; });
  var sheets = list.map(function (x) { return isT ? teacherSheetHtml(x, ix) : classSheetHtml(x, ix); });
  var per = land ? 1 : 2, pages = [];
  for (var i = 0; i < sheets.length; i += per) pages.push('<div class="page ' + (land ? 'landscape' : 'portrait') + '">' + sheets.slice(i, i + per).join('') + '</div>');

  var html = '<div class="panel no-print"><div class="toolbar"><div class="chips">' +
    '<button class="chip' + (!isT ? ' active' : '') + '" data-prmode="class">ตารางเรียน (ห้อง)</button>' +
    '<button class="chip' + (isT ? ' active' : '') + '" data-prmode="teacher">ตารางสอน (ครู)</button></div>' +
    '<select id="prWho"><option value="all">' + (isT ? 'ครูทุกคน' : 'ทุกห้อง') + ' (' + targets.length + ')</option>' + targets.map(function (x) {
      return '<option value="' + esc(keyOf(x)) + '"' + (keyOf(x) === S.prWho ? ' selected' : '') + '>' + esc(isT ? fullName(x) : 'ม.' + x.key) + '</option>';
    }).join('') + '</select>' +
    '<select id="prLayout"><option value="portrait">2 ตารางต่อหน้า (A4 แนวตั้ง)</option><option value="landscape"' + (land ? ' selected' : '') + '>1 ตารางต่อหน้า (A4 แนวนอน)</option></select>' +
    '<span class="spacer"></span><span class="muted">' + pages.length + ' หน้า</span><button class="btn primary" onclick="window.print()">🖨 พิมพ์ / PDF</button></div>' +
    '<p class="muted" style="margin:0">ตอนพิมพ์: เลือกกระดาษ A4 และตั้งระยะขอบ (Margins) เป็น "ไม่มี / None" — ปิด "ส่วนหัวและท้ายกระดาษ" ด้วย</p></div>';
  html += printSettingsHtml();
  html += '<div class="pr-pages">' + (pages.join('') || '<p class="muted">ไม่มีข้อมูล</p>') + '</div>';
  v.innerHTML = html;

  each(v, '[data-prmode]', function (b) { b.onclick = function () { S.prMode = b.dataset.prmode; S.prWho = 'all'; store('prMode', S.prMode); render(); }; });
  $('prWho').onchange = function () { S.prWho = this.value; render(); };
  $('prLayout').onchange = function () { S.prLayout = this.value; store('prLayout', S.prLayout); render(); };
  bindPrintSettings(v);
  // ถ้าตารางยาวเกินครึ่งหน้า (เช่น เรียน 6–7 วัน หรือวิชาเยอะ) ค่อยๆ ลดขนาดตัวอักษรจนพอดี
  each(v, '.sheet', function (sh) {
    var pt = land ? 10.5 : 9;
    while (sh.scrollHeight > sh.clientHeight + 1 && pt > 6) { pt -= 0.5; sh.style.fontSize = pt + 'pt'; }
  });

/** ย่อรูปโลโก้ให้ไม่เกิน max px แล้วแปลงเป็น data URL (ต้องเล็กพอเก็บในเซลล์ Google Sheet) */
function shrinkImage(file, max, done) {
  var r = new FileReader();
  r.onload = function () {
    var img = new Image();
    img.onload = function () {
      var k = Math.min(1, max / Math.max(img.width, img.height));
      var cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      var url = cv.toDataURL('image/png');
      if (url.length > 40000) {
        // รูปถ่าย/สีเยอะ → JPEG พื้นขาว
        var cx = cv.getContext('2d');
        cx.globalCompositeOperation = 'destination-over'; cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
        url = cv.toDataURL('image/jpeg', 0.85);
      }
      if (url.length > 40000) return toast('รูปใหญ่เกินไป ลองใช้รูปที่เล็กหรือเรียบกว่านี้', true);
      done(url);
    };
    img.onerror = function () { toast('เปิดรูปไม่ได้', true); };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

  var subs = subjects();
  return teachers().map(function (t) {
    var rows = [];
    subs.forEach(function (s) {
      var rs = [];
      roomsOf(s).forEach(function (tid, i) { if (tid === t.id) rs.push(i + 1); });
      var tg = teachGroups(s).filter(function (g) { return g.tid === t.id; });

  each(v, '[data-ds]', function (b) {

}

/* ------------------------------------------------------------ สำรอง / นำเข้า */
function exportBackup() {
  var d = S.data;
  var p = { app: 'school-timetable', version: 1, exportedAt: new Date().toISOString(), source: d.offline ? 'offline' : 'online',
    school: d.school, terms: d.terms, teachers: d.teachers, subjects: d.subjects, schedules: d.schedules, print: d.print || {}, fixed: d.fixed, timetable: d.timetable };
  var blob = new Blob([JSON.stringify(p, null, 1)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ตารางสอน-สำรอง-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('ส่งออกไฟล์สำรองแล้ว');
}

function importBackup(file) {
  var reader = new FileReader();
  reader.onload = function () {
    var p;
    try { p = JSON.parse(reader.result); } catch (e) { return toast('อ่านไฟล์ไม่ได้ — ไม่ใช่ไฟล์ JSON', true); }
    if (!p || p.app !== 'school-timetable') return toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบนี้', true);
    var msg = 'นำเข้าไฟล์ ' + file.name + '\nส่งออกเมื่อ ' + String(p.exportedAt || '').slice(0, 16).replace('T', ' ') +
      '\n\nครู ' + p.teachers.length + ' · วิชา ' + p.subjects.length + ' · คาบที่ลงตาราง ' + (p.timetable || []).length +
      '\n\nข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่ ดำเนินการต่อไหม?';
    if (!confirm(msg)) return;
    toast('กำลังนำเข้า…');
    api('importAll', p).then(function () { S.sched = null; S.sel = null; S.prDraft = null; toast('นำเข้าแล้ว'); reload(true); })
      .catch(function (e) { toast('นำเข้าไม่สำเร็จ: ' + e, true); });
  };
  reader.readAsText(file);
}

/* ------------------------------------------------------------ คาบเรียนและกิจกรรมที่ล็อกไว้ */
var DAY_NAMES = ['', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์', 'อาทิตย์'];
var ACTIVITIES = ['ลูกเสือ-เนตรนารี', 'ชุมนุม', 'แนะแนว', 'โฮมรูม', 'กิจกรรมเพื่อสังคมและสาธารณประโยชน์', 'ประชุมครู'];

function schedule() { return S.data.schedules[S.termId]; }
/** แถวของตาราง พร้อมเลขคาบ (ช่วงพักไม่มีเลขคาบ) */
function slots(sch) {
  var n = 0;
  return sch.periods.map(function (p) { return { type: p.type, label: p.label, start: p.start, end: p.end, no: p.type === 'class' ? ++n : 0 }; });
}
function classCount(sch) { return sch.periods.filter(function (p) { return p.type === 'class'; }).length; }
function fixedOf() { return S.data.fixed.filter(function (f) { return f.termId === S.termId; }); }
function lessonsOf() { return S.data.timetable.filter(function (l) { return l.termId === S.termId; }); }
function scopeLabel(f) { return f.level < 0 ? 'ครูทุกคน' : !f.level ? 'ทุกชั้น' : 'ม.' + f.level + (f.room ? '/' + f.room : ' ทุกห้อง'); }
function outside(x, sch) { return sch.days.indexOf(x.day) < 0 || x.period > classCount(sch); }
function toMin(t) { var m = /^(\d{1,2})[:.](\d{2})$/.exec(t || ''); return m ? Number(m[1]) * 60 + Number(m[2]) : NaN; }
function fromMin(m) { m = ((m % 1440) + 1440) % 1440; return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + m % 60).slice(-2); }
function showTime(t) { return String(t).replace(':', '.'); }

/** ตรวจเหมือนฝั่งเซิร์ฟเวอร์ (cleanSchedule_) เพื่อแจ้งก่อนกดบันทึก */
function scheduleErrors(sch) {
  var errs = [], prevEnd = NaN;
  if (!sch.days.length) errs.push('ต้องเลือกวันเรียนอย่างน้อย 1 วัน');
  if (!classCount(sch)) errs.push('ต้องมีคาบเรียนอย่างน้อย 1 คาบ');
  sch.periods.forEach(function (p, i) {
    var a = toMin(p.start), b = toMin(p.end);
    if (isNaN(a) || isNaN(b)) errs.push('แถวที่ ' + (i + 1) + ': กรอกเวลาไม่ครบ');
    else if (a >= b) errs.push('แถวที่ ' + (i + 1) + ': เวลาเริ่มต้องก่อนเวลาสิ้นสุด');
    else if (a < prevEnd) errs.push('แถวที่ ' + (i + 1) + ': เวลาซ้อนกับแถวก่อนหน้า');
    if (!isNaN(b)) prevEnd = b;
  });
  return errs;
}

/** ตาราง วัน × คาบ (แถว = วัน, คอลัมน์ = คาบ แบบตารางสอนของโรงเรียน)
 *  cell(day, no) คืน HTML ของช่อง, tdAttr(day, no) (ถ้ามี) คืน attribute ของ <td> */
function gridHtml(sch, cell, tdAttr) {
  var sl = slots(sch), nDays = sch.days.length;
  var h = '<table class="tt"><thead><tr><th rowspan="2" class="day">วัน / คาบ</th>' + sl.map(function (p) {
    return p.type === 'class' ? '<th>' + p.no + '</th>' : '<th rowspan="2" class="brk"></th>';
  }).join('') + '</tr><tr>' + sl.filter(function (p) { return p.type === 'class'; }).map(function (p) {
    return '<th class="time">' + showTime(p.start) + '–' + showTime(p.end) + '</th>';
  }).join('') + '</tr></thead><tbody>';
  sch.days.forEach(function (day, di) {
    // rowspan ข้าม thead ไม่ได้ ต้องมีช่องพักใน tbody ด้วย ไม่งั้นคาบหลังพักจะเลื่อนมาอยู่ใต้หัวช่วงพัก
    h += '<tr><th class="day">' + DAY_NAMES[day] + '</th>' + sl.map(function (p) {
      if (p.type !== 'class') return di ? '' : '<td rowspan="' + nDays + '" class="brk">' + esc(p.label || 'พัก') + ' ' + showTime(p.start) + '–' + showTime(p.end) + '</td>';
      return '<td' + (tdAttr ? tdAttr(day, p.no) : '') + '>' + cell(day, p.no) + '</td>';
    }).join('') + '</tr>';
  });
  return h + '</tbody></table>';
}

function fixedCell(day, no) {
  return fixedOf().filter(function (f) { return f.day === day && f.period === no; }).map(function (f) {
    return '<div class="fx">' + esc(f.label) + '<small>' + esc(scopeLabel(f)) + '</small></div>';
  }).join('');
}

/** สำเนาที่กำลังแก้ — ยังไม่บันทึกจนกว่าจะกดบันทึก */
function schedDraft() {
  if (!S.sched || S.sched.termId !== S.termId) S.sched = { termId: S.termId, data: JSON.parse(JSON.stringify(schedule())), dirty: false };
  return S.sched;
}

function renderSchedPanel() {
  var el = $('schedPanel');
  if (!el) return;
  var d = schedDraft(), sch = d.data, sl = slots(sch);
  var html = '<h2>คาบเรียนและเวลา — ' + esc(term().label) + '</h2>' +
    '<div class="toolbar"><b>วันเรียน</b><div class="daypick">' + [1, 2, 3, 4, 5, 6, 7].map(function (i) {
      var on = sch.days.indexOf(i) >= 0;
      return '<label class="' + (on ? 'on' : '') + '"><input type="checkbox" data-edit data-day="' + i + '"' + (on ? ' checked' : '') + '>' + DAY_NAMES[i] + '</label>';
    }).join('') + '</div></div>';
  html += '<div class="scroll"><table><thead><tr><th class="num">คาบที่</th><th>ประเภท</th><th>ชื่อช่วงพัก</th><th>เริ่ม</th><th>สิ้นสุด</th><th class="num">นาที</th><th></th></tr></thead><tbody>' +
    sl.map(function (p, i) {
      var mins = toMin(p.end) - toMin(p.start);
      return '<tr class="' + (p.type === 'break' ? 'brk-row' : '') + '"><td class="num"><b>' + (p.no || '—') + '</b></td>' +
        '<td><select data-edit data-pi="' + i + '" data-k="type"><option value="class"' + (p.type === 'class' ? ' selected' : '') + '>คาบเรียน</option>' +
        '<option value="break"' + (p.type === 'break' ? ' selected' : '') + '>ช่วงพัก</option></select></td>' +
        '<td>' + (p.type === 'break' ? '<input type="text" data-edit data-pi="' + i + '" data-k="label" value="' + esc(p.label) + '" placeholder="เช่น พักกลางวัน">' : '<span class="muted">—</span>') + '</td>' +
        '<td><input type="text" class="tm" inputmode="decimal" placeholder="08.30" data-edit data-pi="' + i + '" data-k="start" value="' + esc(showTime(p.start)) + '"></td>' +
        '<td><input type="text" class="tm" inputmode="decimal" placeholder="09.20" data-edit data-pi="' + i + '" data-k="end" value="' + esc(showTime(p.end)) + '"></td>' +
        '<td class="num" data-mins="' + i + '">' + (mins > 0 ? mins : '—') + '</td>' +
        '<td style="white-space:nowrap"><button class="btn small" data-edit data-mv="' + i + '" data-dir="-1" title="เลื่อนขึ้น"' + (i === 0 ? ' disabled' : '') + '>↑</button> ' +
        '<button class="btn small" data-edit data-mv="' + i + '" data-dir="1" title="เลื่อนลง"' + (i === sl.length - 1 ? ' disabled' : '') + '>↓</button> ' +
        '<button class="btn small danger" data-edit data-rm="' + i + '" title="ลบแถวนี้">✕</button></td></tr>';
    }).join('') + '</tbody></table></div>';
  html += '<div class="toolbar" style="margin-top:10px"><button class="btn" data-edit id="addClass">+ คาบเรียน</button><button class="btn" data-edit id="addBreak">+ ช่วงพัก</button>' +
    '<span class="spacer"></span><span id="schedState"></span>' +
    '<button class="btn" data-edit id="schedReset">ยกเลิกการแก้ไข</button><button class="btn primary" data-edit id="schedSave">บันทึกคาบเรียน</button></div>' +
    '<ul class="err-list" id="schedErrs"></ul>' +
    '<h3>ตัวอย่างตาราง</h3><p class="muted" style="margin-top:0">แสดงตามค่าที่กำลังแก้ พร้อมกิจกรรมที่ล็อกไว้</p><div class="scroll" id="schedPreview"></div>';
  el.innerHTML = html;
  refreshSchedBits();

  var structural = function () { d.dirty = true; renderSchedPanel(); };
  each(el, '[data-day]', function (cb) {
    cb.onchange = function () {
      var day = Number(cb.dataset.day);
      sch.days = sch.days.filter(function (x) { return x !== day; });
      if (cb.checked) sch.days.push(day);
      sch.days.sort(function (a, b) { return a - b; });
      structural();
    };
  });
  each(el, '[data-pi]', function (inp) {
    inp.onchange = function () {
      var p = sch.periods[Number(inp.dataset.pi)], k = inp.dataset.k;
      p[k] = inp.value.trim();
      if (inp.classList.contains('tm')) {
        // รับ 8.30 / 08:30 / 0830 แล้วเก็บเป็น HH:MM
        var m = /^(\d{1,2})[.:]?(\d{2})$/.exec(p[k]);
        if (m && Number(m[1]) < 24 && Number(m[2]) < 60) { p[k] = fromMin(Number(m[1]) * 60 + Number(m[2])); inp.value = showTime(p[k]); }
      }
      if (k === 'type') { if (p.type === 'break' && !p.label) p.label = 'พัก'; return structural(); }
      d.dirty = true; refreshSchedBits();
    };
  });
  each(el, '[data-mv]', function (b) {
    b.onclick = function () {
      var i = Number(b.dataset.mv), j = i + Number(b.dataset.dir), ps = sch.periods;
      var t = ps[i]; ps[i] = ps[j]; ps[j] = t;
      structural();
    };
  });
  each(el, '[data-rm]', function (b) { b.onclick = function () { sch.periods.splice(Number(b.dataset.rm), 1); structural(); }; });
  var addRow = function (type) {
    var ps = sch.periods, last = ps[ps.length - 1];
    var lastClass = ps.filter(function (p) { return p.type === 'class'; }).pop();
    var len = type === 'break' ? 20 : (lastClass ? toMin(lastClass.end) - toMin(lastClass.start) : 50);
    var start = last && !isNaN(toMin(last.end)) ? toMin(last.end) : 8 * 60 + 30;
    ps.push({ type: type, label: type === 'break' ? 'พัก' : '', start: fromMin(start), end: fromMin(start + (len > 0 ? len : 50)) });
    structural();
  };
  $('addClass').onclick = function () { addRow('class'); };
  $('addBreak').onclick = function () { addRow('break'); };
  $('schedReset').onclick = function () { S.sched = null; renderSchedPanel(); };
  $('schedSave').onclick = saveSchedule;
  if (!S.data.canEdit) each(el, '[data-edit]', function (x) { x.disabled = true; });
}

/** อัปเดตส่วนที่ขึ้นกับเวลา โดยไม่วาดช่องกรอกใหม่ (ไม่ให้เคอร์เซอร์หลุด) */
function refreshSchedBits() {
  var d = S.sched, sch = d.data, errs = scheduleErrors(sch);
  sch.periods.forEach(function (p, i) {
    var c = document.querySelector('[data-mins="' + i + '"]'), m = toMin(p.end) - toMin(p.start);
    if (c) c.textContent = m > 0 ? m : '—';
  });
  $('schedErrs').innerHTML = errs.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('');
  $('schedState').innerHTML = d.dirty ? '<span class="dirty">● ยังไม่ได้บันทึก</span>' : '<span class="muted">บันทึกแล้ว</span>';
  $('schedPreview').innerHTML = sch.days.length && classCount(sch) ? gridHtml(sch, fixedCell) : '<p class="muted">เลือกวันเรียนและเพิ่มคาบเรียนก่อน</p>';
}

function saveSchedule() {
  var d = S.sched, sch = d.data, errs = scheduleErrors(sch);
  if (errs.length) return toast('ยังบันทึกไม่ได้: ' + errs[0], true);
  var lost = fixedOf().filter(function (f) { return outside(f, sch); }).length;
  var lostL = lessonsOf().filter(function (l) { return outside(l, sch); }).length;
  if ((lost || lostL) && !confirm('มี' + (lost ? 'กิจกรรมที่ล็อกไว้ ' + lost + ' ช่อง ' : '') + (lostL ? 'คาบที่ลงตารางแล้ว ' + lostL + ' คาบ ' : '') +
    'อยู่นอกวัน/คาบใหม่\nรายการเหล่านั้นจะไม่แสดงในตารางจนกว่าจะแก้หรือลบ\n\nบันทึกต่อไหม?')) return;
  var btn = $('schedSave'); btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  api('saveSchedule', S.termId, sch).then(function (res) {
    S.data.schedules[S.termId] = res.schedule; S.sched = null;
    toast('บันทึกคาบเรียนแล้ว'); render();
  }).catch(function (e) { btn.disabled = false; btn.textContent = 'บันทึกคาบเรียน'; toast('บันทึกไม่สำเร็จ: ' + e, true); });
}

function renderFixedPanel() {
  var el = $('fixedPanel');
  if (!el) return;
  var sch = schedule(), n = classCount(sch);
  var list = fixedOf().sort(function (a, b) { return a.day - b.day || a.period - b.period || a.level - b.level || a.room - b.room; });
  var html = '<h2>กิจกรรมและช่วงที่ล็อกไว้</h2><p class="muted" style="margin-top:0">ช่องเหล่านี้จะลงวิชาไม่ได้ในหน้าจัดตาราง เช่น ลูกเสือ ชุมนุม แนะแนว โฮมรูม</p>' +
    '<div class="toolbar"><b>วัน</b><div class="daypick">' + sch.days.map(function (day) {
      return '<label><input type="checkbox" data-edit data-fday="' + day + '">' + DAY_NAMES[day] + '</label>';
    }).join('') + '</div></div><div class="toolbar">' +
    '<label>คาบที่ <select data-edit id="fxPeriod">' + Array.apply(null, Array(n)).map(function (_, i) { return '<option value="' + (i + 1) + '">' + (i + 1) + '</option>'; }).join('') + '</select></label>' +
    '<label>ใช้กับ <select data-edit id="fxLevel"><option value="0">ทุกชั้น</option>' + [1, 2, 3, 4, 5, 6].map(function (l) { return '<option value="' + l + '">ม.' + l + '</option>'; }).join('') +
    '<option value="-1">ครูทุกคน (เช่น PLC — ไม่ล็อกตารางเรียน)</option></select></label>' +
    '<label>ห้อง <select data-edit id="fxRoom" disabled><option value="0">ทุกห้อง</option><option value="1">/1</option><option value="2">/2</option><option value="3">/3</option></select></label>' +
    '<input type="text" data-edit id="fxLabel" list="acts" placeholder="ชื่อกิจกรรม" style="flex:1;min-width:180px"><datalist id="acts">' +
    ACTIVITIES.map(function (a) { return '<option>' + esc(a) + '</option>'; }).join('') + '</datalist>' +
    '<button class="btn primary" data-edit id="fxAdd">+ ล็อกช่อง</button></div>';
  html += '<div class="scroll"><table><thead><tr><th>วัน</th><th class="num">คาบที่</th><th>ใช้กับ</th><th>กิจกรรม</th><th></th></tr></thead><tbody>' +
    (list.map(function (f) {
      var out = outside(f, sch);
      return '<tr class="' + (out ? 'over' : '') + '"><td>' + DAY_NAMES[f.day] + '</td><td class="num">' + f.period + '</td><td>' + esc(scopeLabel(f)) + '</td><td>' + esc(f.label) +
        (out ? ' <span class="status-warn">(อยู่นอกวัน/คาบที่ตั้งไว้)</span>' : '') + '</td><td><button class="btn small danger" data-edit data-dfx="' + esc(f.id) + '">ลบ</button></td></tr>';
    }).join('') || '<tr><td colspan="5" class="muted">ยังไม่มีช่องที่ล็อกไว้</td></tr>') + '</tbody></table></div>';
  el.innerHTML = html;

  each(el, '[data-fday]', function (cb) { cb.onchange = function () { cb.parentNode.classList.toggle('on', cb.checked); }; });
  $('fxLevel').onchange = function () { var r = $('fxRoom'); r.disabled = Number(this.value) < 1; if (r.disabled) r.value = '0'; };
  $('fxAdd').onclick = function () {
    var days = [];
    each(el, '[data-fday]', function (cb) { if (cb.checked) days.push(Number(cb.dataset.fday)); });
    var f = { termId: S.termId, days: days, period: Number($('fxPeriod').value), level: Number($('fxLevel').value), room: Number($('fxRoom').value), label: $('fxLabel').value.trim() };
    if (!days.length) return toast('กรุณาเลือกวันอย่างน้อย 1 วัน', true);
    if (!f.label) return toast('กรุณากรอกชื่อกิจกรรม', true);
    var btn = this; btn.disabled = true;
    api('saveFixed', f).then(function (res) {
      S.data.fixed = S.data.fixed.concat(res.rows);
      toast('ล็อกแล้ว ' + res.rows.length + ' ช่อง' + (res.skipped ? ' (ข้าม ' + res.skipped + ' ช่องที่มีอยู่แล้ว)' : ''));
      render();
    }).catch(function (e) { btn.disabled = false; toast('บันทึกไม่สำเร็จ: ' + e, true); });
  };
  each(el, '[data-dfx]', function (b) {
    b.onclick = function () {
      var id = b.dataset.dfx;
      api('deleteFixed', id).then(function () {
        S.data.fixed = S.data.fixed.filter(function (x) { return x.id !== id; });
        toast('ลบแล้ว'); render();
      }).catch(function (e) { toast('ลบไม่สำเร็จ: ' + e, true); });
    };
  });
  if (!S.data.canEdit) each(el, '[data-edit]', function (x) { x.disabled = true; });
}

function termForm() {
  var terms = S.data.terms.slice().sort(byOrder);
  openModal('<h3>สร้างภาคเรียนใหม่</h3><div class="form-grid">' +
    field('รหัส', '<input type="text" id="f_tid" placeholder="เช่น 2569-1">') +
    field('ชื่อที่แสดง', '<input type="text" id="f_tlabel" placeholder="ภาคเรียนที่ 1 ปีการศึกษา 2569">') +
    field('คัดลอกจาก', '<select id="f_from"><option value="">— เริ่มว่าง —</option>' + terms.map(function (t) {
      return '<option value="' + esc(t.id) + '"' + (String(t.id) === S.termId ? ' selected' : '') + '>' + esc(t.label) + '</option>';
    }).join('') + '</select>') +
    field('', '<label><input type="checkbox" id="f_assign"> คัดลอกการมอบหมายครูด้วย</label>') +
    '</div><p class="muted">คัดลอกรายชื่อครูและรายวิชามาให้แก้ต่อ ข้อมูลภาคเรียนเดิมไม่เปลี่ยน</p>' +
    '<div class="actions"><button class="btn" data-close>ยกเลิก</button><button class="btn primary" id="f_save">สร้าง</button></div>');
  $('f_save').onclick = function () {
    var opts = { id: $('f_tid').value, label: $('f_tlabel').value, copyFrom: $('f_from').value, copyAssign: $('f_assign').checked };
    if (!opts.id.trim() || !opts.label.trim()) return toast('กรุณากรอกรหัสและชื่อภาคเรียน', true);
    busy(this, true);
    api('createTerm', opts).then(function (r) {
      closeModal(); toast('สร้างแล้ว (ครู ' + r.teachers + ', วิชา ' + r.subjects + ')');
      S.termId = opts.id.trim(); store('termId', S.termId); reload(true);
    }).catch(function (e) { busy($('f_save'), false); toast('สร้างไม่สำเร็จ: ' + e, true); });
  };
}

/* ------------------------------------------------------------ modal */
function field(label, input) { return '<label>' + label + '</label><div>' + input + '</div>'; }
function openModal(html) {
  $('modal').innerHTML = html; $('modalBg').classList.add('open');
  each($('modal'), '[data-close]', function (b) { b.onclick = closeModal; });
}
function closeModal() { $('modalBg').classList.remove('open'); }
function busy(btn, on) { if (btn) { btn.disabled = on; btn.textContent = on ? 'กำลังบันทึก…' : 'บันทึก'; } }
$('modalBg').onclick = function (e) { if (e.target === this) closeModal(); };
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if ($('modalBg').classList.contains('open')) return closeModal();
  if (S.sel) { S.sel = null; render(); }
});

/* ------------------------------------------------------------ load */
function reload(quiet) {
  if (!quiet) $('view').innerHTML = '<div class="loading">กำลังโหลดข้อมูล…</div>';
  return api('getData').then(function (d) {
    S.data = d;
    var ids = d.terms.map(function (t) { return String(t.id); });
    if (ids.indexOf(S.termId) < 0) S.termId = ids.length ? String(d.terms.slice().sort(byOrder)[ids.length - 1].id) : null;
    if (d.firebase && d.empty) return emptyFirebaseView();
    if (!S.termId) { $('view').innerHTML = '<div class="banner err">ยังไม่มีข้อมูลภาคเรียน — รัน setup() ในหน้า Apps Script ก่อน</div>'; return; }
    render();
  }).catch(function (e) {
    $('view').innerHTML = '<div class="banner err">โหลดข้อมูลไม่สำเร็จ: ' + esc(e) + '<br>ถ้าเพิ่งเปิดใช้ ตรวจว่าได้รับสิทธิ์เข้าถึง Google Sheet แล้ว</div>';
  });
}

$('termSel').onchange = function () {
  S.termId = this.value; store('termId', S.termId);
  S.repTeacher = 'all'; S.sel = null; render();
};
$('refreshBtn').onclick = function () { reload(false).then(function () { toast('โหลดข้อมูลล่าสุดแล้ว'); }); };
each(document, '#tabs button', function (b) {
  b.onclick = function () { S.tab = b.dataset.tab; store('tab', S.tab); render(); window.scrollTo(0, 0); };
});

// โหลดข้อมูลใหม่เพื่อเห็นสิ่งที่คนอื่นแก้ (ข้ามถ้ากำลังพิมพ์/บันทึก/เปิดหน้าต่างอยู่)
// Sheet: ทุก 60 วินาที · Firebase: เมื่อมีเครื่องอื่นบันทึก (ถ้าติดอยู่จะลองใหม่รอบถัดไป)
var remoteDirty = false;
function autoRefresh() {
  if (!S.data || (S.data.firebase && !remoteDirty)) return;
  if (document.hidden || S.pending || $('modalBg').classList.contains('open')) return;
  var a = document.activeElement;
  if (a && (a.tagName === 'SELECT' || a.tagName === 'INPUT')) return;
  remoteDirty = false;
  var y = window.scrollY;
  reload(true).then(function () { window.scrollTo(0, y); });
}
window.onRemoteChange = function () { remoteDirty = true; autoRefresh(); };
setInterval(autoRefresh, 60000);

try { S.token = sessionStorage.getItem('editToken') || ''; } catch (e) { S.token = ''; }
S.termId = store('termId');
S.tab = store('tab') || 'overview';
S.ttMode = store('ttMode') || 'class';
S.prMode = store('prMode') || 'class';
S.prLayout = store('prLayout') || 'portrait';
reload(false);
</script>
</body>
</html>
